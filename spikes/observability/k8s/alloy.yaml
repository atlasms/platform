# Grafana Alloy — the collector.
#
# The pick that earns its place twice: it ships logs today (EP-12.1) AND speaks OTLP, so
# distributed tracing (EP-12.3) becomes configuration rather than a fifth component in the bundle.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-alloy
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  # Reading logs through the API is what lets this run WITHOUT mounting the host filesystem.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: atlas-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "atlas" {
      targets = discovery.kubernetes.pods.targets

      // Only Atlas' own namespaces. Collecting kube-system as well would multiply the log volume
      // for output an Atlas operator cannot act on anyway.
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "atlas|atlas-observability"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    // Reads container stdout through the Kubernetes API rather than /var/log/pods on the host.
    // No hostPath mount, no privileged container — a log shipper with the host filesystem mounted
    // is a large amount of trust to grant something whose job is to read text.
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.atlas.output
      forward_to = [loki.process.atlas.receiver]
    }

    loki.process "atlas" {
      forward_to = [loki.write.default.receiver]

      // Every Atlas service logs structured JSON to stdout, so the correlation id is a real field
      // rather than something to regex out of a message. Promoting it to a label is what makes
      // "show me everything for this request, across services" a query instead of an afternoon.
      stage.json {
        expressions = { level = "level", correlationId = "correlationId", service = "service" }
      }
      stage.labels {
        values = { level = "level" }
      }
      // correlationId is NOT a label: it is unbounded, and one Loki stream per request would
      // shred the index. Kept as a searchable field in the line instead.
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - name: http
              containerPort: 12345
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: tmp
              mountPath: /tmp/alloy
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: tmp
          emptyDir: {}
