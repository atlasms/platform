openapi: 3.1.0
info:
  title: Atlas Logging & Analytics API
  version: 0.1.0
  description: >-
    Stub contract for Logging & Analytics — permission-filtered log browse/query, metrics,
    analytics reports, and governance config. See ../services/logging-analytics.md.
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: atlas.example }
security:
  - bearerAuth: []
tags:
  - name: logs
  - name: metrics
  - name: reports
  - name: admin
paths:
  /logs:
    get:
      operationId: browseLogs
      tags: [logs]
      summary: Browse the audit log (permission-filtered, FR-LOG-2; scope logs:read)
      description: >-
        One page of the caller's channel's audit log, newest first. `logs:read` is the door; each
        entry is then shown only if the caller holds the permission IT requires — `<domain>:read`
        for an event under `atlas.<ch>.<domain>.…`, the entity's read permission for an
        `audit.recorded` delta. The same rule the WebSocket service applies to live delivery.
        Filtering happens after the read, so a page can come back thin with `nextCursor` still
        present; that is normal, not the end of the log. Keyset on `seq`: pass `nextCursor` back as
        `before`.
      parameters:
        - { name: type, in: query, description: Event type(s), comma-separated., schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, description: The `nextCursor` of the previous page., schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /logs/query:
    post:
      operationId: queryLogs
      tags: [logs]
      summary: The same browse, with the filter as JSON (scope logs:read)
      description: One engine behind both; this form is where a LIST of types fits.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogQuery' } } } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /history/{entityType}/{id}:
    get:
      operationId: getHistory
      tags: [logs]
      summary: The revision timeline of one entity (design §6.4; scope logs:read AND <entityType>:read)
      description: >-
        Projected from the owning service's `audit.recorded` events, one entry per revision, with the
        field-level before/after delta the diff viewer renders. Channel-scoped to the caller. The
        history of an unknown entity is an EMPTY timeline, not a 404 — a 404 would confirm to anyone
        who may read the channel that no such entity ever existed there.
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string }, example: asset }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The timeline, content: { application/json: { schema: { $ref: '#/components/schemas/History' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /metrics:
    get:
      operationId: getMetrics
      tags: [metrics]
      summary: Operational metrics for dashboards (scope ops:read)
      responses:
        '200': { description: Metrics, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /reports/{name}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Run/fetch an analytics report (scope analytics:read)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Report, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /retention-policies:
    get: { operationId: listRetentionPolicies, tags: [admin], summary: List retention policies, responses: { '200': { description: Policies } } }
    post: { operationId: createRetentionPolicy, tags: [admin], summary: Create a retention policy (scope compliance:admin), responses: { '201': { description: Created } } }
  /visibility-rules:
    get: { operationId: listVisibilityRules, tags: [admin], summary: List log-visibility rules, responses: { '200': { description: Rules } } }
    post: { operationId: createVisibilityRule, tags: [admin], summary: Create a visibility rule (scope compliance:admin), responses: { '201': { description: Created } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    LogQuery:
      type: object
      additionalProperties: false
      properties:
        types: { type: array, items: { type: string } }
        correlationId: { type: string }
        actorId: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        before: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AuditEvent:
      type: object
      description: One envelope as appended to the log — the record itself, and its place in the channel's hash chain.
      required: [messageId, channelId, seq, type, occurredAt, payload, prevHash, hash]
      properties:
        messageId: { type: string }
        channelId: { type: string }
        seq: { type: integer, minimum: 1, description: Position in the channel's chain; the browse cursor. }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        actorKind: { type: string, enum: [service, user] }
        actorId: { type: string }
        correlationId: { type: string }
        payload: {}
        prevHash: { type: string }
        hash: { type: string }
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: integer, description: Present when there may be more; pass back as `before`. Absent means the log ran out. }
    LogRecord:
      description: >-
        A structured LOG LINE from a service — not yet ingested; the sink consumes EVENTS (AuditEvent
        above). Kept as the shape log ingestion will normalise to (design §3 LogRecord).
      type: object
      required: [at, service]
      properties:
        at: { type: string, format: date-time }
        service: { type: string }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }
        actor: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        correlationId: { type: string }
    HistoryEntry:
      type: object
      required: [revision, action, at, delta, messageId]
      properties:
        revision: { type: integer, minimum: 1, description: Monotonic per entity; an asset's `version`. }
        action: { type: string, description: The domain event audited, or the operation for a silent mutation. }
        actorKind: { type: string, enum: [service, user] }
        actorId: { type: string }
        at: { type: string, format: date-time }
        correlationId: { type: string }
        delta:
          type: object
          description: Field name -> { before?, after? }. Whole values; a creation has only afters.
          additionalProperties:
            type: object
            properties: { before: {}, after: {} }
        messageId: { type: string, description: The envelope in the audit log this revision came from. }
    History:
      type: object
      required: [entityType, entityId, revisions]
      properties:
        entityType: { type: string }
        entityId: { type: string }
        revisions: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
    Error:
      description: >-
        RFC 9457 Problem Details, served as application/problem+json, with the platform's keys kept:
        `code` is the machine key (a closed enum — VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
        CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL), `message` the text. The RFC members are
        derived from them: `type` is https://atlas.example/problems/<code>, `title` is constant per
        code, `detail` equals `message`, `instance` is urn:atlas:correlation:<correlationId>.
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri }
        code: { type: string, enum: [VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL] }
        message: { type: string }
        details: {}
        correlationId: { type: string }
  responses:
    Error:
      description: Error response
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
