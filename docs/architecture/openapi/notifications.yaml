openapi: 3.1.0
info:
  title: Atlas Notifications & Messaging API
  version: 0.1.0
  description: >-
    Stub contract for Notifications & Messaging — inbox, tasks, messages, notifications, and
    per-user delivery preferences. See ../services/notifications.md.
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: atlas.example }
security:
  - bearerAuth: []
tags:
  - name: inbox
  - name: messages
  - name: tasks
  - name: notifications
  - name: preferences
paths:
  /inbox:
    get:
      operationId: getInbox
      tags: [inbox]
      summary: The caller's inbox — open tasks offered to them and their newest notifications
      description: >-
        Only ever the caller's own (any authenticated user; no permission). The open tasks offered to
        the caller by name, to a group they are in, or to a role they hold — resolved when the inbox
        is READ (EP-25.3, decided 2026-10-16), so a new holder sees an open task and someone who
        left does not. IAM away is not a failed read: the tasks offered by name, and `partial`.
        Messages are EP-25.4.
      responses:
        '200': { description: Inbox, content: { application/json: { schema: { $ref: '#/components/schemas/Inbox' } } } }
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages
      responses:
        '200': { description: Messages, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } }
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a direct or group message (scope message:send)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
  /tasks:
    post:
      operationId: createTask
      tags: [tasks]
      summary: Assign a task by hand — to a user, a group or a role of the channel (FR-APP-1; task:assign)
      description: >-
        A person hands work to someone (EP-25.2): `task:assign` in the channel (Editor and above).
        A workflow's tasks are made by BMS, not here. The creator and a named user assignee are its
        first participants — the people who may read its history without `task:audit`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee, assigneeKind]
              additionalProperties: false
              properties:
                assignee: { type: string, minLength: 1 }
                assigneeKind: { type: string, enum: [user, group, role] }
                kind: { type: string, enum: [approve, edit, review, generic], default: generic }
                subjectRef: { $ref: '#/components/schemas/EntityRef' }
                dueAt: { type: string, format: date-time }
                title: { type: string, maxLength: 200 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/InboxTask' } } } }
        '403': { description: 'No task:assign in the channel' }
  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: One task — to a participant, a holder of what it is offered to, or task:admin
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/InboxTask' } } } }
        '404': { description: 'No such task the caller may see' }
  /tasks/{id}/claim:
    post:
      operationId: claimTask
      tags: [tasks]
      summary: Take a task offered to a group or role you are in — first claim wins (decided 2026-10-16)
      description: >-
        The task becomes the caller's by name. A second claim is a 409; claiming one already yours
        is the same task back. A task offered to a group or a role must be claimed before it is
        forwarded or completed.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200': { description: Claimed, content: { application/json: { schema: { $ref: '#/components/schemas/InboxTask' } } } }
        '403': { description: 'Not in the group or role it is offered to' }
        '409': { description: 'Claimed by someone else, or closed' }
  /tasks/{id}/forward:
    post:
      operationId: forwardTask
      tags: [tasks]
      summary: Hand a task you hold to another user, group or role (or any task, with task:admin)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee, assigneeKind]
              additionalProperties: false
              properties:
                assignee: { type: string, minLength: 1 }
                assigneeKind: { type: string, enum: [user, group, role] }
      responses:
        '200': { description: Forwarded, content: { application/json: { schema: { $ref: '#/components/schemas/InboxTask' } } } }
        '403': { description: 'Not yours, and no task:admin' }
        '409': { description: 'Closed, or offered to a group or role and not yet claimed' }
  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Complete a task you hold, with its outcome
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                outcome: { type: string, maxLength: 100, description: 'For a decision task, e.g. approved/rejected.' }
      responses:
        '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/InboxTask' } } } }
        '403': { description: 'Not yours' }
        '409': { description: 'Closed, or not yet claimed' }
  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Cancel a task (task:admin) — a workflow's task is ended by its workflow, never here
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/InboxTask' } } } }
        '403': { description: 'No task:admin' }
        '409': { description: 'Closed, or a workflow task' }
  /notifications/{id}:
    patch:
      operationId: updateNotification
      tags: [notifications]
      summary: Mark a notification read/dismissed
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      requestBody: { content: { application/json: { schema: { type: object, properties: { read: { type: boolean } } } } } }
      responses:
        '200': { description: Updated }
  /preferences:
    get: { operationId: getPreferences, tags: [preferences], summary: Get per-user delivery preferences, responses: { '200': { description: Preferences } } }
    put: { operationId: putPreferences, tags: [preferences], summary: Update delivery preferences, responses: { '200': { description: Saved } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    Message:
      type: object
      required: [to, body]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        from: { type: string }
        to: { type: array, items: { type: string }, description: 'user or group ids' }
        body: { type: string }
        threadId: { $ref: '#/components/schemas/Ulid' }
    Inbox:
      type: object
      required: [tasks, notifications, unreadCount, partial]
      additionalProperties: false
      properties:
        partial: { type: boolean, description: 'True when the caller''s groups and roles could not be resolved: only the tasks offered to them by name are here.' }
        tasks: { type: array, items: { $ref: '#/components/schemas/InboxTask' }, description: 'Open tasks, oldest due first.' }
        notifications: { type: array, items: { $ref: '#/components/schemas/Notification' }, description: 'Newest first, at most 50.' }
        unreadCount: { type: integer, minimum: 0, description: 'Unread notifications, all of them.' }
    InboxTask:
      type: object
      required: [id, channelId, assignee, assigneeKind, kind, state, createdAt, version, participants]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string }
        assignee: { type: string }
        assigneeKind: { type: string, enum: [user, group, role] }
        kind: { type: string, enum: [approve, edit, review, generic] }
        state: { type: string, enum: [open, forwarded, done, cancelled] }
        subjectRef: { $ref: '#/components/schemas/EntityRef' }
        workflowInstanceId: { $ref: '#/components/schemas/Ulid' }
        dueAt: { type: string, format: date-time }
        title: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        participants: { type: array, items: { type: string }, description: 'Every user it was ever assigned to by name, who claimed it, made it or acted on it — who may read its history.' }
        outcome: { type: string }
        closedBy: { type: string }
        closedAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, channelId, userId, type, severity, read, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string }
        userId: { type: string }
        type: { type: string, description: 'Notification-type key, e.g. asset.re-review-due.' }
        severity: { type: string, enum: [info, warning, critical] }
        subjectRef: { $ref: '#/components/schemas/EntityRef' }
        title: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    EntityRef:
      type: object
      required: [entityType, entityId]
      additionalProperties: false
      properties:
        entityType: { type: string }
        entityId: { type: string }
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string }, correlationId: { type: string } }
  responses:
    Error:
      description: Error response
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
