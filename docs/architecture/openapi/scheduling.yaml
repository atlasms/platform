openapi: 3.1.0
info:
  title: Atlas Scheduling API
  version: 0.1.0
  description: >-
    Scheduling — program tables (v0, EP-18: the reel model and its CRUD), validation, send-to-air
    and export profiles (v1). See ../services/scheduling.md and data-model.md §3.
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: atlas.example }
security:
  - bearerAuth: []
tags:
  - name: schedules
  - name: admin
paths:
  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: The channel's program tables (scope schedule:read)
      description: Channel-scoped to the caller. Newest broadcast day first; keyset on id.
      parameters:
        - { name: broadcastDate, in: query, description: One day only., schema: { type: string, format: date } }
        - { name: after, in: query, description: The `nextCursor` of the previous page., schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/SchedulePage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a program table for a broadcast day (scope schedule:write)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSchedule' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '409': { description: A schedule for that channel and broadcast day already exists., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: A program table with its reel (scope schedule:read)
      responses:
        '200': { description: 'The schedule and its items, in reel order', content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleWithItems' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Change the header — timezone, notes (scope schedule:write)
      description: State is not writable here; it moves through validate and send-to-air (v1).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSchedule' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /schedules/{id}/items:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: listScheduleItems
      tags: [schedules]
      summary: The reel, in order (scope schedule:read)
      responses:
        '200': { description: 'Items ordered by seq, sub-schedule items after their parent', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScheduleItem' } } } } }
    put:
      operationId: replaceScheduleItems
      tags: [schedules]
      summary: Replace the whole reel — the editor's save (scope schedule:write)
      description: >-
        The THIN write path (data-model §3.4/§3.6): the items are persisted as given, with the
        `start`s the editor computed. No overlap or gap is refused here; `POST /validate` reports
        them on demand. What IS enforced: every item belongs to this schedule and channel; `seq` is
        unique per reel and per sub-reel; a `live` item has no media; a sub-schedule is exactly one
        level deep; a non-live item has a `mediaId`. Ids are kept where given so history survives a
        save, minted where absent.
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScheduleItemInput' } } } } }
      responses:
        '200': { description: The reel as stored, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScheduleItem' } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: addScheduleItem
      tags: [schedules]
      summary: Append one item (scope schedule:write)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleItemInput' } } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleItem' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /schedules/{id}/items/{itemId}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    patch:
      operationId: updateScheduleItem
      tags: [schedules]
      summary: Change one item (scope schedule:write)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleItemPatch' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleItem' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeScheduleItem
      tags: [schedules]
      summary: Remove one item, and its sub-schedule if it has one (scope schedule:write)
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
  /schedules/{id}/copy:
    post:
      operationId: copySchedule
      tags: [schedules]
      summary: Copy a time-range of this reel onto another schedule, or itself (FR-SCH-13; scope schedule:read on the source, schedule:write on the target)
      description: >-
        data-model §3.7. The TOP-LEVEL items that START in `[from, to)` — the whole reel when both
        are absent — are copied with their sub-schedules, shifted so that `from` (or the first
        item's start) lands at `at`, with new ids; everything else travels as it is (fixed anchors,
        title and category overrides, in/out points, notes). `merge` adds them to the target;
        `overwrite` first removes the target's top-level items that START in the destination range
        (`[at, at + (to - from))`). Nothing is cut at an edge: an overlap the copy leaves is
        `POST /validate`'s to name. One write on the target, a compare-and-set on `targetVersion`
        — a stale one is a 409 — with `schedule.updated` and an `audit.recorded` (action
        `schedule.copied`) whose delta is the reel before and after and where it came from.
      parameters:
        - { name: id, in: path, required: true, description: The source schedule., schema: { $ref: '#/components/schemas/Ulid' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CopyScheduleInput' } } } }
      responses:
        '200': { description: The target after the copy, content: { application/json: { schema: { $ref: '#/components/schemas/CopyResult' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /schedules/{id}/validate:
    post:
      operationId: validateSchedule
      tags: [schedules]
      summary: Validate the reel on demand (scope schedule:write; FR-SCH-2/3)
      description: >-
        ADVISORY, never a gate on save (data-model §3.4): the reel is checked as stored and the
        report says what is wrong with it. Gaps, overlaps and anchor overruns come from the reel;
        approval and expiry from what MAM announced about each item's media (Scheduling keeps it
        from `asset.approved`/`rejected`/`expired`/`deleted`/`updated`), judged at the time the item
        AIRS, not now; rights from the channel's rights windows (the asset's own, else its
        category's — an item governed by windows must lie wholly inside one); availability from
        HSM, asked at validation time — the rendition an item airs (its `renditionKind`, else
        `broadcast`) must be online, intact and the channel's. When HSM cannot be asked, availability
        is named in `unchecked` instead of passing. A run with no critical issue moves a draft to `validated`; any later edit
        moves it back to `draft`. Every run emits `schedule.validated`.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200': { description: The report, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationReport' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /schedules/{id}/send-to-air:
    post:
      operationId: sendToAir
      tags: [schedules]
      summary: Serialize the playlist and trigger HSM delivery (scope schedule:send; audited)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '202': { description: Sending }
        '409': { $ref: '#/components/responses/Error' }
  /rights-windows:
    get:
      operationId: listRightsWindows
      tags: [rights]
      summary: The channel's rights windows, by validFrom (asset:read on the rights field group)
      parameters:
        - { name: assetId, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: categoryId, in: query, schema: { type: string } }
      responses:
        '200': { description: Windows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RightsWindow' } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createRightsWindow
      tags: [rights]
      summary: License an asset or a category for a period (asset:write on the rights field group; audited)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RightsWindowInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RightsWindow' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /rights-windows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: getRightsWindow
      tags: [rights]
      summary: One rights window
      responses:
        '200': { description: The window, content: { application/json: { schema: { $ref: '#/components/schemas/RightsWindow' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateRightsWindow
      tags: [rights]
      summary: Replace a window's terms over the version read (compare-and-set; audited)
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RightsWindowInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RightsWindow' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteRightsWindow
      tags: [rights]
      summary: Remove a window at the version read (compare-and-set; audited)
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /export-profiles:
    get: { operationId: listExportProfiles, tags: [admin], summary: List export profiles, responses: { '200': { description: Profiles } } }
    post: { operationId: createExportProfile, tags: [admin], summary: Create an export profile (format + destination + path-rewrite), responses: { '201': { description: Created } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    ItemType:
      type: string
      description: Tier 0 — the playout treats each differently; a `live` item has no media and may carry a sub-schedule.
      enum: [media, live, title, filler, break]
    Timecode:
      type: string
      description: 'HH:MM:SS:FF — the playout applies it (data-model §3.3).'
      pattern: '^\\d{2}:\\d{2}:\\d{2}:\\d{2}$'
    CopyScheduleInput:
      type: object
      required: [targetScheduleId, targetVersion, at, mode]
      additionalProperties: false
      properties:
        from: { type: string, format: date-time, description: 'The source range, by item start — with `to`, or neither (the whole reel).' }
        to: { type: string, format: date-time }
        targetScheduleId: { $ref: '#/components/schemas/Ulid' }
        targetVersion: { type: integer, minimum: 1, description: "The target's version, read: the copy is a compare-and-set on it." }
        at: { type: string, format: date-time, description: "Where the range's start lands." }
        mode: { type: string, enum: [merge, overwrite] }
    CopyResult:
      type: object
      required: [schedule, items, copied, removed]
      properties:
        schedule: { $ref: '#/components/schemas/Schedule' }
        items: { type: array, items: { $ref: '#/components/schemas/ScheduleItem' } }
        copied: { type: integer, description: 'Items copied, sub-schedule items included.' }
        removed: { type: integer, description: 'Target items an overwrite removed, sub-schedule items included.' }
    Schedule:
      type: object
      description: The header of one channel's program table for one broadcast day (data-model §3.1).
      required: [id, channelId, broadcastDate, timezone, state, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string }
        broadcastDate: { type: string, format: date, description: 'The channel-local broadcast day; its boundary need not be midnight.' }
        timezone: { type: string, description: 'IANA zone the broadcast day is expressed in.', example: Europe/London }
        state: { type: string, enum: [draft, validated, sending, sent, failed] }
        notes: { type: string }
        version: { type: integer, minimum: 1, description: Bumped on every write to the header OR the reel; the audit revision. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateSchedule:
      type: object
      required: [broadcastDate, timezone]
      additionalProperties: false
      properties:
        broadcastDate: { type: string, format: date }
        timezone: { type: string }
        notes: { type: string }
    UpdateSchedule:
      type: object
      additionalProperties: false
      properties:
        timezone: { type: string }
        notes: { type: string }
    ScheduleItem:
      type: object
      description: >-
        One row of the reel (data-model §3.2). `start` is MATERIALIZED — the editor computes it and
        the backend stores it (§3.6); `end` is computed from start + duration for range queries.
        `parentItemId` places the item inside a live item's sub-schedule, one level deep (§3.5).
      required: [id, scheduleId, seq, start, durationSec, end, fixed, itemType, repeat, featured, description]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        scheduleId: { $ref: '#/components/schemas/Ulid' }
        parentItemId: { $ref: '#/components/schemas/Ulid' }
        seq: { type: integer, minimum: 0, description: 'Order within the reel, or within the parent''s sub-reel.' }
        start: { type: string, format: date-time, description: Materialized; locked when `fixed`. }
        durationSec: { type: number, minimum: 0 }
        end: { type: string, format: date-time, description: Computed by the service — start + duration. Read-only. }
        fixed: { type: boolean, description: A time-locked anchor — its start does not reflow (§3.4). }
        itemType: { $ref: '#/components/schemas/ItemType' }
        mediaId: { $ref: '#/components/schemas/Ulid' }
        renditionKind: { type: string }
        mediaIn: { $ref: '#/components/schemas/Timecode' }
        mediaOut: { $ref: '#/components/schemas/Timecode' }
        mediaTitle: { type: string, description: Defaults from the media; overridable for on-air display. }
        categoryId: { type: string }
        categoryTitle: { type: string, description: Defaults from the category; overridable. }
        episode: { type: integer, minimum: 0 }
        description: { type: string, description: Control-room notes. }
        repeat: { type: boolean, description: A rebroadcast of a past item. }
        featured: { type: boolean, description: Marked important for the control room. }
    ScheduleItemInput:
      type: object
      description: An item as the editor sends it. `id` optional (kept if given, minted if not); `end` never — it is computed.
      required: [seq, start, durationSec, itemType]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        parentItemId: { $ref: '#/components/schemas/Ulid' }
        seq: { type: integer, minimum: 0 }
        start: { type: string, format: date-time }
        durationSec: { type: number, minimum: 0 }
        fixed: { type: boolean, default: false }
        itemType: { $ref: '#/components/schemas/ItemType' }
        mediaId: { $ref: '#/components/schemas/Ulid' }
        renditionKind: { type: string }
        mediaIn: { $ref: '#/components/schemas/Timecode' }
        mediaOut: { $ref: '#/components/schemas/Timecode' }
        mediaTitle: { type: string }
        categoryId: { type: string }
        categoryTitle: { type: string }
        episode: { type: integer, minimum: 0 }
        description: { type: string, default: '' }
        repeat: { type: boolean, default: false }
        featured: { type: boolean, default: false }
    ScheduleItemPatch:
      type: object
      description: Any subset of the writable fields.
      additionalProperties: false
      properties:
        parentItemId: { $ref: '#/components/schemas/Ulid' }
        seq: { type: integer, minimum: 0 }
        start: { type: string, format: date-time }
        durationSec: { type: number, minimum: 0 }
        fixed: { type: boolean }
        itemType: { $ref: '#/components/schemas/ItemType' }
        mediaId: { $ref: '#/components/schemas/Ulid' }
        renditionKind: { type: string }
        mediaIn: { $ref: '#/components/schemas/Timecode' }
        mediaOut: { $ref: '#/components/schemas/Timecode' }
        mediaTitle: { type: string }
        categoryId: { type: string }
        categoryTitle: { type: string }
        episode: { type: integer, minimum: 0 }
        description: { type: string }
        repeat: { type: boolean }
        featured: { type: boolean }
    ScheduleWithItems:
      allOf:
        - $ref: '#/components/schemas/Schedule'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ScheduleItem' } }
    IssueKind:
      type: string
      description: Tier 0 — each kind is a validator with its own rule (schedule.validated).
      enum: [gap, overlap, anchor, approval, expiry, rights, availability]
    ValidationIssue:
      type: object
      required: [kind, severity, message]
      properties:
        kind: { $ref: '#/components/schemas/IssueKind' }
        itemId: { $ref: '#/components/schemas/Ulid' }
        severity: { type: string, enum: [info, warning, critical], description: 'critical makes the schedule invalid; a gap is a warning (a filler may fill it at playout).' }
        message: { type: string }
        seconds: { type: number, description: 'gap/overlap/anchor: how long the dead air or the overrun is.' }
    ValidationReport:
      type: object
      required: [scheduleId, version, state, valid, issues, unchecked, validatedAt]
      properties:
        scheduleId: { $ref: '#/components/schemas/Ulid' }
        version: { type: integer, minimum: 1, description: The version validated. }
        state: { type: string, enum: [draft, validated, sending, sent, failed], description: The schedule's state after this run. }
        valid: { type: boolean, description: No critical issue. }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        unchecked: { type: array, items: { $ref: '#/components/schemas/IssueKind' }, description: 'Validators that did not run, and so found nothing: availability, when HSM could not be asked (not configured, or away).' }
        validatedAt: { type: string, format: date-time }
    RightsWindowInput:
      type: object
      description: >-
        What a window licenses and when. Exactly one of `assetId` and `categoryId`. An item is
        governed by its asset's windows if the asset has any, else by its category's, else it is not
        rights-managed; a governed item must lie wholly inside one window.
      required: [validFrom, validTo]
      properties:
        assetId: { $ref: '#/components/schemas/Ulid' }
        categoryId: { type: string }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time, description: After validFrom. }
        territory: { type: string, description: 'Recorded, not evaluated: a channel carries no territory yet.' }
        notes: { type: string }
    RightsWindow:
      allOf:
        - $ref: '#/components/schemas/RightsWindowInput'
        - type: object
          required: [id, channelId, version, createdBy, createdAt, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            channelId: { type: string }
            version: { type: integer, minimum: 1, description: The audit revision and the compare-and-set token. }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SchedulePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Schedule' } }
        nextCursor: { $ref: '#/components/schemas/Ulid' }
    Error:
      description: >-
        RFC 9457 Problem Details, served as application/problem+json, with the platform's keys kept:
        `code` is the machine key (a closed enum), `message` the text. `type` is
        https://atlas.example/problems/<code>, `title` constant per code, `detail` equals `message`,
        `instance` is urn:atlas:correlation:<correlationId>.
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri }
        code: { type: string, enum: [VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL] }
        message: { type: string }
        details: {}
        correlationId: { type: string }
  responses:
    Error:
      description: Error response
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
