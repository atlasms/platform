openapi: 3.1.0
info:
  title: Atlas MTS API
  version: 0.1.0
  description: >-
    Stub contract for the Media Transcoding System. Thin and mostly queue-driven — jobs are
    normally enqueued via the broker by BMS/RIM, not users. See ../services/mts.md.
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: atlas.example }
security:
  - bearerAuth: []
tags:
  - name: jobs
  - name: admin
  - name: internal
paths:
  /jobs:
    post:
      operationId: enqueueJob
      tags: [internal]
      # EP-16.1. The same enqueue `transcode.job.create` performs over the broker, for an operator,
      # a tool or the smoke suite. 202: the job is accepted, not done; the body is the job so the
      # caller has the id to poll. Refused (422) before anything is written when it can never run:
      # an unknown preset, an input outside MTS's work root, or an input that does not exist.
      summary: Enqueue a transcode job (normally a broker command from BMS/RIM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, presetIds, inputPath]
              properties:
                assetId: { $ref: '#/components/schemas/Ulid' }
                presetIds:
                  type: array
                  minItems: 1
                  description: Built-in presets are `proxy`, `thumbnail`, `audio-proxy` and `broadcast` (EP-16.3); run in the order given.
                  items: { type: string }
                inputPath:
                  type: string
                  description: A path inside MTS's work root, until HSM (EP-14) resolves inputs. Relative paths resolve against the root.
                priority: { type: integer, description: 'Higher runs sooner; equal priorities run oldest first. Default 0.' }
      responses:
        '202': { description: Job queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
    get:
      operationId: listJobs
      tags: [jobs]
      summary: The caller's channel's jobs, oldest first, optionally one asset's
      parameters:
        - { name: assetId, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Jobs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Job' } } } } }
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Job status, progress and — once completed — its renditions. Another channel's job is 404.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /profiles:
    # EP-16.6 — the Tier-1 registry (mts.md §11.1). A profile is a STRUCTURED target MTS compiles to
    # FFmpeg arguments from an allowlist; there is no raw-arguments field, by design. `config:admin`
    # in the profile's channel writes; a platform-wide profile (no channelId) needs an unscoped grant.
    get:
      operationId: listProfiles
      tags: [admin]
      summary: The profiles the caller's channel resolves against — its own and the platform-wide ones (config:read)
      responses:
        '200': { description: Profiles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Profile' } } } } }
    post:
      operationId: createProfile
      tags: [admin]
      summary: 'Create a profile; the same id as a built-in preset redefines it for the channel (config:admin)'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: scope
        in: query
        description: '`channel` (the default) for the caller''s channel''s profile of this id; `platform` for the platform-wide one.'
        schema: { type: string, enum: [channel, platform] }
    get:
      operationId: getProfile
      tags: [admin]
      summary: One profile (config:read)
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: replaceProfile
      tags: [admin]
      # Whole-profile replacement with `version` as the compare-and-set: a stale write is 409, not a
      # silent overwrite of another administrator's change. There is no DELETE — a Tier-1 entry is
      # disabled (`enabled: false`), never removed (configuration §2.2).
      summary: 'Replace a profile; `version` must be the current one, or 409 (config:admin)'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileReplace' } } } }
      responses:
        '200': { description: Replaced, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /workers:
    get:
      operationId: getWorkers
      tags: [admin]
      summary: Current worker topology (for dashboards)
      responses:
        '200':
          description: Workers
          content: { application/json: { schema: { type: object, properties: { count: { type: integer }, queueDepth: { type: integer } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    Job:
      type: object
      description: >-
        A transcode job (mts.md §3.1). `failed` is not terminal — the job is leased again after
        `retryAt`; `dead-letter` is, and happens at once for a refusal of the INPUT (bytes FFmpeg
        will not decode) and after the last attempt for anything else.
      required: [id, channelId, assetId, presetIds, inputPath, state, attempts, priority, createdBy, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string }
        assetId: { $ref: '#/components/schemas/Ulid' }
        presetIds: { type: array, items: { type: string } }
        inputPath: { type: string }
        state: { type: string, enum: [queued, running, completed, failed, dead-letter] }
        attempts: { type: integer, minimum: 0, description: 'Attempts started. An attempt interrupted by a drain is given back.' }
        percent: { type: number, minimum: 0, maximum: 100, description: Best-effort progress across the job's presets. Never a state. }
        renditions:
          type: array
          description: Set once completed — one per preset, in the order produced. What `transcode.completed` carries, plus the preset.
          items: { $ref: '#/components/schemas/RenditionResult' }
        reason: { type: string, description: 'Why the last attempt failed, or why it was dead-lettered.' }
        retryAt: { type: string, format: date-time, description: A failed job is not leased again before this. }
        workerId: { type: string, description: The worker holding (or last holding) it — a pod name. }
        priority: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ProfileInput:
      type: object
      required: [id, name, kind, container, enabled]
      description: >-
        A transcode profile as an administrator writes it. Structured, never raw FFmpeg arguments —
        every value is an enum or a bounded number (the grammar in apps/mts/src/profile.ts), and a
        combination FFmpeg would refuse is a 422 naming the rule. At least one of `video` / `audio`.
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
        channelId: { type: string, nullable: true, description: 'Omit for the caller''s channel; null for platform-wide (unscoped config:admin).' }
        name: { type: string, minLength: 1 }
        description: { type: string }
        kind: { type: string, enum: [proxy, broadcast, thumbnail] }
        container: { type: string, enum: [mp4, mov, mxf, m4a, jpg] }
        video:
          type: object
          required: [codec, width, height]
          properties:
            codec: { type: string, enum: [h264, mpeg2, prores] }
            width: { type: integer, minimum: 16, maximum: 7680 }
            height: { type: integer, minimum: 16, maximum: 4320 }
            fit: { type: string, enum: [pad, fit], description: '`pad` letter/pillarboxes to exactly width×height; `fit` scales within it.' }
            frameRate: { type: string, enum: ['23.976', '24', '25', '29.97', '30', '50', '59.94', '60'], description: 'Conform to this rate. Absent keeps the source rate.' }
            scan: { type: string, enum: [progressive, tff, bff] }
            chroma: { type: string, enum: ['420', '422'] }
            bitrateMbps: { type: number, minimum: 0.1, maximum: 400, description: 'Constant for mpeg2; capped for h264. Or `quality`, not both.' }
            quality: { type: integer, minimum: 0, maximum: 51 }
            gpu: { type: string, enum: [none, nvenc, qsv], description: 'h264 only. Tested on the node; if unusable the CPU encodes and the rendition says so.' }
        audio:
          type: object
          required: [codec]
          properties:
            codec: { type: string, enum: [aac, pcm_s16le, pcm_s24le] }
            sampleRate: { type: integer, enum: [44100, 48000] }
            channels: { type: integer, minimum: 1, maximum: 16 }
            bitrateKbps: { type: integer, minimum: 32, maximum: 512 }
        enabled: { type: boolean, description: 'false hides it from new jobs; profiles are disabled, never deleted.' }
    ProfileReplace:
      allOf:
        - $ref: '#/components/schemas/ProfileInput'
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1, description: The version being replaced — the compare-and-set. }
    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileInput'
        - type: object
          required: [version, createdBy, createdAt, updatedAt]
          properties:
            version: { type: integer, minimum: 1 }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    RenditionResult:
      type: object
      required: [presetId, kind, path, checksum, sizeBytes]
      properties:
        presetId: { type: string }
        kind: { type: string, description: 'A RenditionKind (common.schema.json) — defined once there, not repeated here.' }
        path: { type: string }
        checksum:
          type: object
          required: [algorithm, value]
          properties: { algorithm: { type: string }, value: { type: string } }
        sizeBytes: { type: integer, minimum: 0 }
        durationSec: { type: number, minimum: 0, description: Absent for a still. }
        encoder: { type: string, description: 'The FFmpeg encoder that produced it, e.g. libx264 or h264_nvenc.' }
        fallback: { type: boolean, description: 'The profile asked for a GPU this node could not use; the CPU encoded it.' }
    Error:
      description: >-
        RFC 9457 Problem Details, served as application/problem+json, with the platform's keys kept:
        `code` is the machine key (a closed enum — VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
        CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL), `message` the text. The RFC members are
        derived from them: `type` is https://atlas.example/problems/<code>, `title` is constant per
        code, `detail` equals `message`, `instance` is urn:atlas:correlation:<correlationId>.
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri }
        code: { type: string, enum: [VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL] }
        message: { type: string }
        details: {}
        correlationId: { type: string }
  responses:
    Error:
      description: Error response
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
