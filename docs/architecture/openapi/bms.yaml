openapi: 3.1.0
info:
  title: Atlas BMS API
  version: 0.2.0
  description: >-
    The Business Process Management System — workflow definitions (authored, validated, published
    as immutable versions) and, from EP-22.3, their running instances on Temporal (ADR-0010). See
    ../services/bms.md and ../bms-workflow-dsl-and-designer.md. A definition's graph is the domain
    contract ../schemas/workflow-definition.schema.json; it is validated against that schema, the
    graph rules (§6) and the restricted FEEL subset (§3) before it can be published. Human tasks are
    NOT here — a workflow's task is created through Notifications, completed there, and its completion
    signals the waiting instance (EP-25.8; notifications.yaml `/tasks`).
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: atlas.example }
security:
  - bearerAuth: []
tags:
  - name: workflows
  - name: instances
paths:
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: The channel's workflows in every state, by id (workflow:read or workflow:admin)
      parameters:
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/WorkflowState' } }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Ulid' }, description: The last id of the previous page. }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: A page of workflows, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow — its draft is version 1 (workflow:admin)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DraftInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workflows/catalog:
    get:
      operationId: getWorkflowCatalog
      tags: [workflows]
      summary: >-
        Every ACTIVE workflow of the channel with its published definition — the copy every
        authenticated user's client loads at sign-in and refreshes on `workflow.changed` (EP-22.11).
        No workflow permission is needed: an active workflow is visible to everyone in the channel.
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string }, description: "The catalog's ETag as last fetched: unchanged is a 304." }
      responses:
        '200':
          description: The catalog
          headers:
            ETag: { schema: { type: string }, description: Changes whenever any workflow in it does. }
          content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } }
        '304': { description: Unchanged since the ETag sent. }
        '401': { $ref: '#/components/responses/Error' }
  /workflows/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: activateWorkflow
      tags: [workflows]
      summary: An inactive workflow becomes active again — in the catalog, able to start instances (workflow:admin)
      responses:
        '200': { description: Active, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: "Not inactive (a draft is activated by publishing it; an archived workflow is final), or the revision moved.", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /workflows/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: deactivateWorkflow
      tags: [workflows]
      summary: >-
        An active workflow becomes inactive — out of the catalog, no new instances (workflow:admin).
        REFUSED while any instance of it is still running or waiting.
      responses:
        '200': { description: Inactive, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: "Not active, the revision moved, or instances are still running (`details.running` counts them).", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /workflows/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: archiveWorkflow
      tags: [workflows]
      summary: >-
        Retire a workflow for good — kept for its history, never active again (workflow:admin).
        REFUSED while any instance of it is still running or waiting.
      responses:
        '200': { description: Archived, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: "Already archived, the revision moved, or instances are still running (`details.running` counts them).", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /workflows/palette:
    get:
      operationId: getPalette
      tags: [workflows]
      summary: Step kinds + their config schemas (drives the designer palette, FR-BMS-8; EP-23.1) — workflow:admin
      responses:
        '200': { description: Palette, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PaletteEntry' } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /workflows/import:
    post:
      operationId: importWorkflow
      tags: [workflows]
      summary: Import a BPMN 2.0 file to a draft definition, validated (FR-BMS-10; EP-23.8)
      requestBody: { required: true, content: { application/xml: { schema: { type: string } } } }
      responses:
        '201': { description: 'Draft definition', content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '422': { description: 'Unsupported BPMN elements', content: { application/json: { schema: { $ref: '#/components/schemas/ImportError' } } } }
  /workflows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: A workflow — its header, its open draft (if any) and its published versions
      responses:
        '200': { description: The workflow, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workflows/{id}/draft:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 }, description: "The workflow revision the edit was made on; another write in between is a 409." }
    put:
      operationId: saveDraft
      tags: [workflows]
      summary: >-
        Save the draft — the whole graph, as the designer holds it (workflow:admin). An invalid graph
        is SAVED (a draft is work in progress); only publish refuses it. With no open draft, this
        opens one at the next version.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DraftInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workflows/{id}/validate:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    post:
      operationId: validateWorkflow
      tags: [workflows]
      summary: >-
        Validate a graph without saving it (live designer feedback, FR-BMS-9) — the body's, or with no
        body the stored draft's. The same rules publish applies.
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DraftInput' } } } }
      responses:
        '200': { description: 'Validation result', content: { application/json: { schema: { $ref: '#/components/schemas/ValidationResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: There is no draft to validate and no body was sent., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /workflows/{id}/publish:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 }, description: "The revision whose draft is being published; another write in between is a 409." }
    post:
      operationId: publishWorkflow
      tags: [workflows]
      summary: Validate the draft and publish it as an immutable version (FR-BMS-9; workflow:admin)
      responses:
        '200': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/PublishResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { description: "The draft is invalid — never published. The problem document's `details.issues` is the ValidationResult's issues.", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /workflows/{id}/versions/{version}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getWorkflowVersion
      tags: [workflows]
      summary: One version's definition — a published one is immutable; the draft's is its latest save
      responses:
        '200': { description: The definition, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDefinition' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workflows/{id}/export:
    get:
      operationId: exportWorkflow
      tags: [workflows]
      summary: Export the definition as BPMN 2.0 XML with DI layout (FR-BMS-10; EP-23.8)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [bpmn], default: bpmn } }
      responses:
        '200': { description: 'BPMN 2.0 document', content: { application/xml: { schema: { type: string } } } }
  /instances:
    get:
      operationId: listInstances
      tags: [instances]
      summary: The channel's workflow instances, newest first (workflow:read, :act or :admin)
      parameters:
        - { name: workflowId, in: query, required: false, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [running, waiting, completed, failed] }, description: "Only instances in this state — `failed` is the operator's list of runs nothing caught (EP-22.9)." }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Ulid' }, description: The last id of the previous page. }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: A page of instances, content: { application/json: { schema: { $ref: '#/components/schemas/InstancePage' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: startInstance
      tags: [instances]
      summary: >-
        Start an instance of a PUBLISHED workflow version (workflow:act). It is pinned to that
        version for its whole life. Runs on Temporal (ADR-0010); 503 when the runtime is away.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StartInstance' } } } }
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInstance' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: "The workflow is not active, or has no published version (or not the one named).", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '503': { description: The workflow runtime (Temporal) could not be reached; nothing was started., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /instances/{id}:
    get:
      operationId: getInstance
      tags: [instances]
      summary: An instance's state, where it is waiting, and its step history (FR-BMS-6)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200': { description: Instance, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowInstance' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /instances/{id}/signal:
    post:
      operationId: signalInstance
      tags: [instances]
      summary: >-
        Deliver a step's completion or event to a waiting instance (workflow:act) — the generic
        path until EP-22.4's event router delivers completions from the bus. A signal for a step not
        yet waiting is kept until it waits.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Signal' } } } }
      responses:
        '202': { description: Delivered to the runtime }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: The instance has ended., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '503': { description: The workflow runtime (Temporal) could not be reached., content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    WorkflowDefinition:
      description: >-
        The domain contract docs/architecture/schemas/workflow-definition.schema.json — steps,
        transitions, vars. Referenced, not copied, so the two cannot drift.
      $ref: '../schemas/workflow-definition.schema.json'
    DraftInput:
      type: object
      required: [name, steps, transitions]
      description: >-
        A definition as the designer sends it. `id`, `channelId`, `version`, `status` and `metadata`
        are the server's and are ignored if sent; the rest is stored as given.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        scope: { type: object, properties: { categoryId: { type: string }, mediaType: { type: string }, usage: { type: string } } }
        vars: { type: array, maxItems: 100, items: { type: object } }
        steps: { type: array, maxItems: 500, items: { type: object } }
        transitions: { type: array, maxItems: 1000, items: { type: object } }
    WorkflowState:
      type: string
      enum: [draft, active, inactive, archived]
      description: >-
        draft — never published; active — in the catalog, starts instances (a first publish makes
        it so); inactive — out of the catalog, no new instances, can be reactivated; archived —
        final, kept for its history. Deactivating and archiving are refused while instances run.
    CatalogEntry:
      type: object
      required: [id, name, revision, version, definition]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        description: { type: string }
        scope: { type: object, properties: { categoryId: { type: string }, mediaType: { type: string }, usage: { type: string } } }
        revision: { type: integer }
        version: { type: integer, description: The published version a new instance runs. }
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
    Catalog:
      type: object
      required: [etag, items]
      properties:
        etag: { type: string, description: The same value as the ETag header. }
        items: { type: array, items: { $ref: '#/components/schemas/CatalogEntry' } }
    VersionSummary:
      type: object
      required: [version, publishedAt, publishedBy]
      properties:
        version: { type: integer, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string }
    Workflow:
      type: object
      required: [id, channelId, name, state, revision, latestVersion, versions, createdBy, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string }
        state: { $ref: '#/components/schemas/WorkflowState' }
        name: { type: string, description: "The draft's name while one is open, else the latest published version's." }
        description: { type: string }
        scope: { type: object, properties: { categoryId: { type: string }, mediaType: { type: string }, usage: { type: string } } }
        revision: { type: integer, minimum: 1, description: "Every write bumps it; `?revision=` on a write is compare-and-set." }
        latestVersion: { type: integer, minimum: 0, description: The newest PUBLISHED version; 0 before the first publish. }
        draftVersion: { type: integer, minimum: 1, description: The open draft's version — always latestVersion + 1. Absent when there is none. }
        draft: { $ref: '#/components/schemas/WorkflowDefinition' }
        versions: { type: array, description: "Published versions, newest first.", items: { $ref: '#/components/schemas/VersionSummary' } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowSummary:
      type: object
      required: [id, channelId, name, state, revision, latestVersion]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string }
        name: { type: string }
        state: { $ref: '#/components/schemas/WorkflowState' }
        description: { type: string }
        revision: { type: integer }
        latestVersion: { type: integer }
        draftVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
    WorkflowPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkflowSummary' } }
        nextCursor: { $ref: '#/components/schemas/Ulid' }
    StartInstance:
      type: object
      required: [workflowId]
      properties:
        workflowId: { $ref: '#/components/schemas/Ulid' }
        version: { type: integer, minimum: 1, description: "A published version; omitted: the latest published." }
        vars: { type: object, description: "Initial values of the definition's declared vars, over their `initial`s." }
        assetId: { $ref: '#/components/schemas/Ulid' }
    Signal:
      type: object
      required: [stepId]
      properties:
        stepId: { type: string, minLength: 1, description: The waiting step this completes — its id in the definition. }
        payload: { type: object, description: "What the step receives as `incoming`; its output mappings read it." }
    HistoryEntry:
      type: object
      required: [seq, stepId, event, at]
      properties:
        seq: { type: integer, minimum: 1 }
        stepId: { type: string }
        event: { type: string, enum: [entered, awaiting, completed, failed, compensated, escalated] }
        at: { type: string, format: date-time }
        result: {}
    WorkflowInstance:
      type: object
      required: [id, channelId, workflowId, version, state, currentSteps, startedAt, startedBy]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string }
        workflowId: { $ref: '#/components/schemas/Ulid' }
        version: { type: integer, description: The published version it is pinned to. }
        assetId: { $ref: '#/components/schemas/Ulid' }
        parentId: { $ref: '#/components/schemas/Ulid' }
        state: { type: string, enum: [running, waiting, completed, failed], description: "As the mirror last recorded it; Temporal holds the instance (ADR-0010)." }
        currentSteps: { type: array, items: { type: string }, description: The steps it is waiting in. }
        startedAt: { type: string, format: date-time }
        startedBy: { type: string, description: "Who started it — a user, or `bms` when its trigger did." }
        triggeredBy:
          type: object
          description: "Set when its start step's trigger started it (EP-22.7): the event and the message."
          required: [event, messageId]
          properties:
            event: { type: string }
            messageId: { $ref: '#/components/schemas/Ulid' }
        endedAt: { type: string, format: date-time }
        endStepId: { type: string }
        error: { type: string }
        vars: { type: object, description: The vars when it ended. }
        history: { type: array, description: Every step event in order — on a single read only., items: { $ref: '#/components/schemas/HistoryEntry' } }
    InstancePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkflowInstance' } }
        nextCursor: { $ref: '#/components/schemas/Ulid' }
    PaletteEntry:
      type: object
      required: [kind, label, configSchema]
      description: 'One draggable step kind for the designer palette (see workflows/palette.json).'
      properties:
        kind: { type: string, enum: [start, end, command, human-task, wait-event, timer, branch, parallel, sub-flow] }
        label: { type: string }
        icon: { type: string }
        category: { type: string, enum: [events, activities, gateways] }
        bpmn: { type: string, description: 'the BPMN element this maps to' }
        waits: { type: string, enum: [no, yes, if-await, at-join, on-trigger] }
        configSchema: { type: object, description: 'The kind''s config as a self-contained JSON Schema — its $def in workflow-definition.schema.json with every $ref inlined (EP-23.1).' }
        hint: { type: string }
        choices: { type: object, description: "The closed lists the kind's property panel offers — publish holds a definition to the same lists: start → triggers, command → commands (target, answers, the authority each requires), wait-event → events." }
    ValidationIssue:
      type: object
      required: [severity, code, message]
      description: 'One diagnostic. Anchored to a step or a transition (never both).'
      properties:
        severity: { type: string, enum: [error, warning] }
        code: { type: string, description: 'stable machine code, e.g. UNREACHABLE_STEP, FEEL_PARSE, FEEL_SUBSET, BRANCH_NO_DEFAULT, UNBOUND_VAR, SUBFLOW_UNPUBLISHED' }
        message: { type: string }
        stepId: { type: string }
        transitionId: { type: string }
        path: { type: string, description: 'JSON pointer into the definition, e.g. /steps/3/config/await/correlate' }
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean, description: 'false if any issue has severity=error' }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    PublishResult:
      type: object
      required: [workflowId, version, publishedAt, revision, state]
      properties:
        workflowId: { $ref: '#/components/schemas/Ulid' }
        state: { $ref: '#/components/schemas/WorkflowState', description: "A first publish makes the workflow active; a later one leaves its state as it was." }
        version: { type: integer }
        publishedAt: { type: string, format: date-time }
        revision: { type: integer, description: The workflow's revision after publishing. }
        warnings: { type: array, description: Warnings the published graph still carries., items: { $ref: '#/components/schemas/ValidationIssue' } }
    ImportError:
      type: object
      required: [code, message]
      description: 'BPMN import rejected: constructs outside the Atlas subset are reported, never silently dropped.'
      properties:
        code: { type: string, enum: [UNSUPPORTED_BPMN, MALFORMED_XML] }
        message: { type: string }
        unsupported:
          type: array
          items:
            type: object
            properties:
              elementId: { type: string }
              elementType: { type: string, description: 'e.g. bpmn:inclusiveGateway, bpmn:subProcess (event)' }
              reason: { type: string }
    Error:
      description: >-
        RFC 9457 Problem Details, served as application/problem+json, with the platform's keys kept:
        `code` is the machine key (a closed enum), `message` the text. `type` is
        https://atlas.example/problems/<code>, `title` constant per code, `detail` equals `message`,
        `instance` is urn:atlas:correlation:<correlationId>.
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri }
        code: { type: string, enum: [VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL] }
        message: { type: string }
        details: {}
        correlationId: { type: string }
  responses:
    Error:
      description: Error response
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
