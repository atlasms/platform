openapi: 3.1.0
info:
  title: Atlas IAM API
  version: 0.1.0
  description: >-
    Stub contract for Identity & Access Management — authentication, tokens, and CRUD for users,
    groups, roles, and permission rules. See ../services/iam.md. `/groups`, `/roles`, `/rules`
    mirror the `/users` collection shape (listed here once).
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: atlas.example
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: admin
paths:
  /auth/login:
    # Served at the ROOT, not under /api/v1: the gateway's public route is `/auth`, and the browser,
    # the smoke suite and every service that verifies a token call it there. A path-level `servers`
    # is how OpenAPI records that, and the generated operations table (EP-02.4) reads it — before
    # this, the document said `/api/v1/auth/login` and nothing on the platform served it.
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate; returns access + refresh (or triggers MFA/SSO)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # `username`: what IAM reads and Studio sends. This said `login` while
              # both ends said `username` — the same kind of lie `permVersion` was.
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    post:
      operationId: refresh
      tags: [auth]
      summary: Rotate the refresh token and mint a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the refresh-token family
      description: >-
        Always 204, whether or not the token existed — telling a caller which is an oracle.
        `allSessions` revokes every family the subject holds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
                allSessions: { type: boolean, default: false }
      responses:
        '204': { description: Logged out }
  /.well-known/jwks.json:
    # RFC 8615: well-known URIs live at the origin root, never under an API prefix.
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    get:
      operationId: getJwks
      tags: [auth]
      summary: Public keys for local JWT validation (served at root, not /api/v1)
      security: []
      responses:
        '200': { description: JWKS, content: { application/json: { schema: { type: object } } } }
  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users (scope-filtered)
      parameters:
        - { name: channelId, in: query, schema: { type: string } }
      responses:
        '200': { description: Users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user (admin scope)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: getUser
      tags: [admin]
      summary: Get a user
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user
      responses:
        '204': { description: Deleted }
  /groups/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    post:
      operationId: addGroupMember
      tags: [admin]
      summary: Add a user to a group
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userId], properties: { userId: { $ref: '#/components/schemas/Ulid' } } } } } }
      responses:
        '204': { description: Added }
    delete:
      operationId: removeGroupMember
      tags: [admin]
      summary: Remove a user from a group
      parameters:
        - { name: userId, in: query, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '204': { description: Removed }
  /users/{id}/effective-permissions:
    parameters:
      # `me` is the caller — the subject the gateway established — and is the only form IAM serves
      # today; Studio loads its session from it.
      - { name: id, in: path, required: true, description: 'A user ULID, or `me` for the caller', schema: { type: string } }
    get:
      operationId: getEffectivePermissions
      tags: [admin]
      summary: Resolved permission set (union of user + group rules, FR-IAM-4)
      responses:
        '200':
          description: Effective permissions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PermissionRule' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    TokenPair:
      type: object
      # `permVersion`, not `permissionVersion`. This stub said the latter while FR-IAM-14, the JWT
      # claim, the `x-atlas-perm-version` internal header and every line of code said the former —
      # a documented lie about a live endpoint that survived because nothing ever compared the two.
      # EP-11.5 generates Studio's types from this file, which is what finally made them disagree
      # out loud. `expiresIn` was simply missing.
      required: [accessToken, refreshToken, expiresIn, permVersion]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: string, description: 'Access-token lifetime, e.g. "15m".' }
        permVersion: { type: integer }
    User:
      type: object
      required: [id, login]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        login: { type: string }
        displayName: { type: string }
        channelIds: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        mfaEnrolled: { type: boolean }
    PermissionRule:
      type: object
      required: [action, resourceType]
      properties:
        action: { type: string, examples: ['asset:write'] }
        resourceType: { type: string }
        scope: { type: string, description: 'channel/department/resource selector' }
    Error:
      description: >-
        RFC 9457 Problem Details, served as application/problem+json, with the platform's keys kept:
        `code` is the machine key (a closed enum — VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
        CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, INTERNAL), `message` the text. The RFC members are
        derived from them: `type` is https://atlas.example/problems/<code>, `title` is constant per
        code, `detail` equals `message`, `instance` is urn:atlas:correlation:<correlationId>.
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri }
        code: { type: string, enum: [VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, INTERNAL] }
        message: { type: string }
        details: {}
        correlationId: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
