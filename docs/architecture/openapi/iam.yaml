openapi: 3.1.0
info:
  title: Atlas IAM API
  version: 0.1.0
  description: >-
    Identity & Access Management — authentication, tokens, and the administration of users,
    groups, roles and grants (EP-10.4). See ../services/iam.md. Rules are not a collection of
    their own: a rule lives inline in the role, group or assignment that carries it
    (policy-rule.schema.json), so there is no `/rules`. Every admin operation requires `user:admin`
    in the channel of the row it touches; a platform-wide row (no channel) requires an unscoped
    grant. Every mutation emits `audit.recorded` with a field-level delta, and every change to
    what a user may do emits `permissions.changed` with the user's new `permVersion`.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: atlas.example
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: admin
paths:
  /auth/login:
    # Served at the ROOT, not under /api/v1: the gateway's public route is `/auth`, and the browser,
    # the smoke suite and every service that verifies a token call it there. A path-level `servers`
    # is how OpenAPI records that, and the generated operations table (EP-02.4) reads it — before
    # this, the document said `/api/v1/auth/login` and nothing on the platform served it.
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate; returns access + refresh (or triggers MFA/SSO)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # `username`: what IAM reads and Studio sends. This said `login` while
              # both ends said `username` — the same kind of lie `permVersion` was.
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    post:
      operationId: refresh
      tags: [auth]
      summary: Rotate the refresh token and mint a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the refresh-token family
      description: >-
        Always 204, whether or not the token existed — telling a caller which is an oracle.
        `allSessions` revokes every family the subject holds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
                allSessions: { type: boolean, default: false }
      responses:
        '204': { description: Logged out }
  /.well-known/jwks.json:
    # RFC 8615: well-known URIs live at the origin root, never under an API prefix.
    servers: [{ url: 'https://{host}', variables: { host: { default: atlas.example } } }]
    get:
      operationId: getJwks
      tags: [auth]
      summary: Public keys for local JWT validation (served at root, not /api/v1)
      security: []
      responses:
        '200': { description: JWKS, content: { application/json: { schema: { type: object } } } }
  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: The users the caller may administer, by id (keyset)
      parameters:
        - { name: channelId, in: query, schema: { type: string }, description: 'Defaults to the caller''s channel.' }
        - { name: after, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Users, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user (user:admin in its channel); emits user.created
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUser' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '4XX': { $ref: '#/components/responses/Error' }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: getUser
      tags: [admin]
      summary: Get a user
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user's profile, state or password; emits user.updated
      description: >-
        `state` may be set to `active` or `disabled`. Disabling revokes every session and bumps
        `permVersion` (so `permissions.changed` reaches the gateway and the WebSocket service);
        setting `active` on a locked account is the operator's unlock. `locked` and `invited`
        are set by the system, not here. A new `password` replaces the credential.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUser' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /users/{id}/assignments:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: listAssignments
      tags: [admin]
      summary: The user's direct grants — roles by id and inline rules
      responses:
        '200': { description: Assignments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
    post:
      operationId: createAssignment
      tags: [admin]
      summary: Grant a role or a rule to the user; emits permissions.changed
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses:
        '201': { description: Granted, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /users/{id}/assignments/{assignmentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      - { name: assignmentId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteAssignment
      tags: [admin]
      summary: Revoke a grant; emits permissions.changed
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/effective-permissions:
    parameters:
      # `me` is the caller — the subject the gateway established. Any other id requires user:admin
      # in the user's channel.
      - { name: id, in: path, required: true, description: 'A user ULID, or `me` for the caller', schema: { type: string } }
    get:
      operationId: getEffectivePermissions
      tags: [admin]
      summary: The compiled policy (union of user + group rules, flattened through roles, FR-IAM-4)
      responses:
        '200':
          description: The compiled policy, as @atlas/policy evaluates it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePolicy' }
  /groups:
    get:
      operationId: listGroups
      tags: [admin]
      summary: The groups the caller may administer — the channel's, and the platform-wide ones
      parameters:
        - { name: channelId, in: query, schema: { type: string } }
      responses:
        '200': { description: Groups, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Group' } } } } }
    post:
      operationId: createGroup
      tags: [admin]
      summary: Create a group
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: getGroup
      tags: [admin]
      summary: A group, with its members
      responses:
        '200': { description: Group, content: { application/json: { schema: { $ref: '#/components/schemas/GroupWithMembers' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateGroup
      tags: [admin]
      summary: Change a group's name, rules or roles; a grant change reaches every member
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteGroup
      tags: [admin]
      summary: Delete a group; every member is removed first (group.membership.changed each)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /groups/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      operationId: listGroupMembers
      tags: [admin]
      summary: The members' user ids
      responses:
        '200': { description: Members, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Ulid' } } } } }
    post:
      operationId: addGroupMember
      tags: [admin]
      summary: Add a user to a group; emits group.membership.changed and permissions.changed
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userId], properties: { userId: { $ref: '#/components/schemas/Ulid' } } } } } }
      responses:
        '204': { description: Added (or already a member) }
        '4XX': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeGroupMember
      tags: [admin]
      summary: Remove a user from a group; emits group.membership.changed and permissions.changed
      parameters:
        - { name: userId, in: query, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '204': { description: Removed (or was not a member) }
  /roles:
    get:
      operationId: listRoles
      tags: [admin]
      summary: The roles the caller may administer — the channel's, and the platform-wide starter roles
      parameters:
        - { name: channelId, in: query, schema: { type: string } }
      responses:
        '200': { description: Roles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } }
    post:
      operationId: createRole
      tags: [admin]
      summary: Create a role — a named bundle of rules
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
  /roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRole
      tags: [admin]
      summary: A role
      responses:
        '200': { description: Role, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateRole
      tags: [admin]
      summary: Change a role's name or rules; a rule change reaches every holder, directly or through a group
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '4XX': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteRole
      tags: [admin]
      summary: Delete a role that nothing holds; 409 while an assignment or group still carries it
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /roles/{id}/holders:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRoleHolders
      tags: [admin]
      # The question `DELETE /roles/{id}` already answers internally to decide its 409, and the
      # one an administrator has to answer before editing a role's rules: a rule change reaches
      # every holder at once, so "who" is the blast radius. Same authorization as reading the
      # role itself.
      summary: Who holds this role — directly, and through which groups
      responses:
        '200': { description: Holders, content: { application/json: { schema: { $ref: '#/components/schemas/RoleHolders' } } } }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    RoleHolders:
      type: object
      required: [users, groups]
      description: >-
        Who a role reaches. `groups` are the groups that carry it; `users` is every person it
        reaches, whether by their own grant, through a group, or both — flattened, because the
        question "who gets this rule change" has one answer per person, not one per path.
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, username]
            properties:
              id: { $ref: '#/components/schemas/Ulid' }
              username: { type: string }
              assignmentId:
                type: string
                description: >-
                  The direct grant's id, absent when the role reaches this user only through a
                  group. It is what `DELETE /users/{id}/assignments/{assignmentId}` revokes — so a
                  caller never has to read the user's assignments to take a role back.
              viaGroupIds:
                type: array
                description: The groups that carry the role to this user. Empty for a direct-only holder.
                items: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: '#/components/schemas/Ulid' }
              name: { type: string }
    TokenPair:
      type: object
      # `permVersion`, not `permissionVersion`. This stub said the latter while FR-IAM-14, the JWT
      # claim, the `x-atlas-perm-version` internal header and every line of code said the former —
      # a documented lie about a live endpoint that survived because nothing ever compared the two.
      # EP-11.5 generates Studio's types from this file, which is what finally made them disagree
      # out loud. `expiresIn` was simply missing.
      required: [accessToken, refreshToken, expiresIn, permVersion]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: string, description: 'Access-token lifetime, e.g. "15m".' }
        permVersion: { type: integer }
    UserState:
      type: string
      enum: [active, disabled, locked, invited]
      description: 'common.schema.json#/$defs/UserState. `locked` is the lockout policy''s, `invited` the invitation flow''s; an admin sets only active or disabled.'
    User:
      type: object
      required: [id, username, state, permVersion, version, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        channelId: { type: string, description: 'Absent for a platform-wide account.' }
        username: { type: string }
        name: { type: string }
        state: { $ref: '#/components/schemas/UserState' }
        permVersion: { type: integer, description: 'Bumped on ANY change to what the user may do; tokens below it are refused at the edge.' }
        version: { type: integer, description: 'Bumped on every write to the record; the audit revision.' }
        lastPasswordChange: { type: string, format: date-time }
        lastLogin: { type: string, format: date-time }
        lastIp: { type: string }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { $ref: '#/components/schemas/Ulid' }
    CreateUser:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password, description: 'Omit for an SSO-only account.' }
        name: { type: string }
        channelId: { type: string, description: 'Defaults to the caller''s channel. Null for platform-wide, which needs an unscoped user:admin.', nullable: true }
        state: { type: string, enum: [active, invited], default: active }
    UpdateUser:
      type: object
      properties:
        name: { type: string }
        state: { type: string, enum: [active, disabled] }
        password: { type: string, format: password }
    Scope:
      type: object
      description: 'policy-rule.schema.json#/properties/scope — an OMITTED predicate means any.'
      properties:
        channelIds: { type: array, items: { type: string } }
        categoryPaths: { type: array, items: { type: string } }
        states: { type: array, items: { type: string } }
        ownedOnly: { type: boolean }
    Rule:
      type: object
      description: 'The atomic grant — policy-rule.schema.json, which is what @atlas/policy evaluates.'
      required: [id, permissions]
      properties:
        id: { type: string }
        description: { type: string }
        effect: { type: string, enum: [allow, deny] }
        permissions: { type: array, items: { type: string }, minItems: 1 }
        scope: { $ref: '#/components/schemas/Scope' }
        fieldGroups: { type: array, items: { type: string } }
    Role:
      type: object
      required: [id, rules, version]
      properties:
        id: { type: string }
        channelId: { type: string, description: 'Absent for a platform-wide role (the starter roles).' }
        name: { type: string }
        description: { type: string }
        rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
        version: { type: integer }
    RoleInput:
      type: object
      properties:
        id: { type: string, description: 'Chosen on create (kebab-case); minted when omitted. Ignored on update.' }
        channelId: { type: string, nullable: true, description: 'On create only. Defaults to the caller''s channel; null is platform-wide.' }
        name: { type: string }
        description: { type: string }
        rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
    Group:
      type: object
      required: [id, name, version]
      properties:
        id: { $ref: '#/components/schemas/Ulid', description: 'Minted by IAM — it travels in group.membership.changed.' }
        channelId: { type: string }
        name: { type: string }
        description: { type: string }
        rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
        roleIds: { type: array, items: { type: string }, description: 'Roles by id — editing the role edits it for every group carrying it.' }
        version: { type: integer }
    GroupWithMembers:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [members]
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/Ulid' } }
    GroupInput:
      type: object
      properties:
        channelId: { type: string, nullable: true, description: 'On create only.' }
        name: { type: string }
        description: { type: string }
        rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
        roleIds: { type: array, items: { type: string } }
    Assignment:
      type: object
      description: 'One direct grant to one user: a role by id OR an inline rule, never both.'
      required: [id, userId]
      properties:
        id: { type: string }
        userId: { $ref: '#/components/schemas/Ulid' }
        roleId: { type: string }
        rule: { $ref: '#/components/schemas/Rule' }
    AssignmentInput:
      type: object
      properties:
        roleId: { type: string }
        rule: { $ref: '#/components/schemas/Rule' }
    EffectivePolicy:
      type: object
      description: 'What @atlas/policy compiles and evaluates; cached by consumers against permVersion.'
      required: [subjectId, permVersion, rules]
      properties:
        subjectId: { $ref: '#/components/schemas/Ulid' }
        permVersion: { type: integer }
        rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
    Error:
      description: >-
        RFC 9457 Problem Details, served as application/problem+json, with the platform's keys kept:
        `code` is the machine key (a closed enum — VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
        CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL), `message` the text. The RFC members are
        derived from them: `type` is https://atlas.example/problems/<code>, `title` is constant per
        code, `detail` equals `message`, `instance` is urn:atlas:correlation:<correlationId>.
      type: object
      required: [type, title, status, detail, code, message]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri }
        code: { type: string, enum: [VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL] }
        message: { type: string }
        details: {}
        correlationId: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
