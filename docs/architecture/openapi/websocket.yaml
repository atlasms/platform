openapi: 3.1.0
info:
  title: Atlas WebSocket Service
  version: 0.1.0
  description: >-
    Stub contract for the WebSocket (Pusher) service. The primary interface is a WSS stream at
    `/ws` whose JSON frame protocol (subscribe/unsubscribe/event/progress/resume/ping) is
    documented in ../services/websocket.md — OpenAPI describes only the HTTP surface (upgrade
    handshake, health, stats).
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: atlas.example
security:
  - bearerAuth: []
tags:
  - name: ws
  - name: health
paths:
  /ws:
    get:
      operationId: openWebSocket
      tags: [ws]
      summary: Establish a WSS connection (HTTP Upgrade)
      description: >-
        Requires a valid access token. On success the connection upgrades to WSS and speaks the
        frame protocol in the service spec. Permission filtering applies to every outbound frame.
      responses:
        '101': { description: Switching Protocols (upgraded to WSS) }
        '401': { $ref: '#/components/responses/Error' }
  /ws/stats:
    get:
      operationId: getWsStats
      tags: [ws]
      summary: Connection and subscription counts for THIS node (internal)
      description: >-
        Point-in-time counts held by one replica. With more than one, the number an operator wants
        is the sum across pods, which is what `/metrics` gives Prometheus. `deliveredPerSec` was
        specified here and is deliberately not implemented: a rate computed server-side over an
        arbitrary window is strictly worse than `rate(atlas_ws_events_delivered_total[5m])` over
        the counter `/metrics` already exposes, and having both invites them to disagree.
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                required: [connections, subscriptions]
                properties:
                  connections: { type: integer }
                  subscriptions: { type: integer }
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200': { description: OK }
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness probe — 503 while a critical dependency (IAM) is unreachable
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: Prometheus exposition (unauthenticated; a scraper is infrastructure, not a user)
      security: []
      responses:
        '200':
          description: Metrics
          content:
            text/plain: { schema: { type: string } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
