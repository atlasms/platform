name: CI

# EP-01.2 (pipeline) + EP-01.3 (consumer fanout).
# On a PR we run only what the change AFFECTS; on main we run everything.
# `nx affected` walks the project graph, so touching a shared lib runs every dependent's
# tests — that is the consumer-fanout requirement, not a separate mechanism.
#
# The event schemas under docs/ are EXECUTABLE: @atlas/contracts loads all 53 of them at
# runtime, so a malformed schema is a broken build, not a doc typo. nx.json lists them in
# `sharedGlobals`, which makes a schema change affect every project. Verified:
#
#   docs/architecture/schemas/common.schema.json  -> all projects affected
#   libs/contracts/src/registry.ts                -> contracts only
#   docs/README.md (prose)                        -> nothing
#
# So no separate schema job is needed; re-check with:
#   npx nx show projects --affected --files=<path>

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the older run; never cancel a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Nx Cloud is deliberately not used — the build must work air-gapped (FR-PLat-7).
  NX_CLOUD_ACCESS_TOKEN: ""
  NX_DAEMON: "false"

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: `nx affected` diffs against the merge base, and a shallow
          # clone makes that comparison silently wrong rather than failing loudly.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      # --- PR: only what this change affects -------------------------------
      - name: Affected (lint, typecheck, test)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint typecheck test --base=origin/${{ github.base_ref }} --head=HEAD

      # --- main: everything, no exceptions ---------------------------------
      - name: All projects (lint, typecheck, test)
        if: github.event_name == 'push'
        run: npx nx run-many -t lint typecheck test

  # Conventional commits (EP-01.6). Branch protection cannot enforce anything on this
  # repo's current plan (.github/rulesets/README.md), so this at least makes a bad
  # commit message visible on the PR.
  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check conventional-commit format
        run: |
          # `spike` is ours, not Conventional Commits': the delivery process treats a spike as a
          # first-class work type with its own artifact rule (20-delivery-process.md §5),
          # so filing one as `chore` would hide it in the history.
          pattern='^(feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert|spike)(\([a-zA-Z0-9._,/-]+\))?!?: .+'
          fail=0
          # --no-merges: a merge commit's subject is generated by GitHub, not by us.
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::not a conventional commit: $subject"
              fail=1
            else
              echo "ok: $subject"
            fi
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          if [ "$fail" -eq 1 ]; then
            echo "Expected: <type>(<scope>): <subject>   e.g. feat(EP-04.1): lift service-kit into libs/"
            exit 1
          fi
