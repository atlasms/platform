name: CI

# EP-01.2 (pipeline) + EP-01.3 (consumer fanout).
# On a PR we run only what the change AFFECTS; on main we run everything.
# `nx affected` walks the project graph, so touching a shared lib runs every dependent's
# tests — that is the consumer-fanout requirement, not a separate mechanism.
#
# The event schemas under docs/ are EXECUTABLE: @atlas/contracts loads all 53 of them at
# runtime, so a malformed schema is a broken build, not a doc typo. nx.json lists them in
# `sharedGlobals`, which makes a schema change affect every project. Verified:
#
#   docs/architecture/schemas/common.schema.json  -> all projects affected
#   libs/contracts/src/registry.ts                -> contracts only
#   docs/README.md (prose)                        -> nothing
#
# So no separate schema job is needed; re-check with:
#   npx nx show projects --affected --files=<path>

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the older run; never cancel a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Nx Cloud is deliberately not used — the build must work air-gapped (FR-PLat-7).
  NX_CLOUD_ACCESS_TOKEN: ""
  NX_DAEMON: "false"

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real Postgres, because the conformance suites are the platform's argument that an adapter
    # behaves — and running them only against the sqlite/in-memory doubles asserts the doubles.
    # AGENTS.md puts it plainly: tenant isolation and outbox atomicity are properties of the
    # ADAPTER. Until this, `ATLAS_PG_URL` was set only on a developer's machine, so whether the
    # Postgres adapter had ever been exercised depended on whether whoever wrote it had Docker
    # running that day. It is a service container rather than a step: it starts in parallel with
    # checkout, so the whole guarantee costs the job roughly nothing.
    #
    # Pinned to the same images as infra/docker-compose.dev.yml, so CI tests what dev tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
          # Deterministic collation: index order must not depend on the runner's locale.
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      # The hot index (EP-07.4), for the same reason: `apps/logging` runs its browse conformance
      # against the real engine, and libs/data-opensearch its client tests. Single-node, no
      # security plugin, a 512 MB heap — the dev topology, pinned to the same tag as the manifests.
      opensearch:
        image: opensearchproject/opensearch:2.19.3
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40

    env:
      # Read by apps/mam/test/store-pg.test.ts and libs/data-pg/test/pg.test.ts. Both FAIL rather
      # than skip when CI is set and these are missing, so deleting the infrastructure below can
      # never quietly return the build to doubles-only.
      ATLAS_PG_URL: postgres://atlas:atlas@localhost:5432/atlas
      ATLAS_NATS_URL: nats://localhost:4222
      ATLAS_OPENSEARCH_URL: http://localhost:9200

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: `nx affected` diffs against the merge base, and a shallow
          # clone makes that comparison silently wrong rather than failing loudly.
          fetch-depth: 0

      # NATS needs `--jetstream`, and a `services:` block cannot set a container's command — only
      # its image, env, ports and `docker create` options. So the broker ADR-0001 actually chose
      # starts here instead. The asymmetry with Postgres is the limitation, not a preference.
      - name: Start JetStream
        run: |
          docker run -d --name atlas-ci-nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine --jetstream --http_port=8222
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8222/healthz >/dev/null; then
              echo "JetStream ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::JetStream did not become ready in 30s"
          docker logs atlas-ci-nats
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # ffprobe for RIM's probe adapter test (EP-15.4): it generates a clip with ffmpeg and reads
      # it back with the real binary. The test skips on a laptop without the tools and FAILS here
      # without them — the same rule as ATLAS_PG_URL, so the adapter cannot quietly go untested.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      # The generated types must match their contracts — Studio's from the OpenAPI stubs (EP-11.5),
      # the event payloads from the JSON Schemas (EP-02.3). NOT part of `nx test`: nx skips
      # unaffected projects, and a change to `docs/architecture/openapi/*.yaml` touches no project
      # at all — so the one edit that can cause drift is exactly the one an affected-only run would
      # ignore.
      - name: API types match the contracts
        run: npm run api:check

      # Also unconditional, and it must come BEFORE `affected`: the property under test is that the
      # graph `affected` walks is complete. A relative cross-package import or an undeclared
      # `@atlas/*` dependency drops an edge silently — and the project that lost it is then exactly
      # the one an affected-only run would skip.
      - name: Project graph is complete (consumer fanout)
        run: npm run graph:check

      # Every overlay renders and keeps its conventions (EP-07.5): probes, requests, a read-only
      # root; and staging shaped like production — registry images by release tag, no NodePort,
      # no seed, one TLS Ingress, a PDB per multi-replica deployment. kubectl is on the runner.
      # The same step checks the Helm chart (ADR-0006): the generator is re-run and compared
      # with what is committed, `helm lint` passes, and both renders are held to the same
      # conventions. helm is on the runner too; the check REFUSES to skip when CI is set.
      - name: Manifests render and hold their conventions
        run: npm run k8s:check

      # Every `enum` in the schemas is a Tier-0 decision — code branches on it — and each is recorded
      # with its reason in docs/architecture/schemas/tier0-enums.json. An enum that is not there is
      # either a new behaviour or a list an operator should own, and only a person can say which.
      - name: Tier-0 enums are inventoried and defined once
        run: npm run tier0:check

      # EP-07.6: one owner per table, both adapters define it, channel_id or a written reason.
      - name: Tables are owned, doubled, and channel-scoped (or say why not)
        run: npm run schema:check

      # `scripts/` is not an Nx project, so `nx affected -t lint` never sees it — its eslint block
      # existed from the start and nothing ran it. These scripts are CI's own checks; they get linted.
      - name: Scripts lint
        run: npm run lint:scripts

      # --- PR: only what this change affects -------------------------------
      # `build` too: only Studio has one, and it is the production AOT compile plus the bundle
      # budgets in its angular.json — neither of which lint, typecheck or the unit tests run. Until
      # this step existed the initial bundle sat over its budget and nothing but a local build said so.
      - name: Affected (lint, typecheck, test, build)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint typecheck test build --base=origin/${{ github.base_ref }} --head=HEAD

      # --- main: everything, no exceptions ---------------------------------
      - name: All projects (lint, typecheck, test, build)
        if: github.event_name == 'push'
        run: npx nx run-many -t lint typecheck test build

      # EP-04.9. The generator's own tests run above against a virtual tree; this is the other
      # half: run it for REAL, then hold what it wrote to the same lint, strict typecheck and tests
      # every service is held to. A scaffold that only passes the generator's tests is a template,
      # not a service — and the template is the thing most likely to rot, because nothing else
      # imports it. Last in the job so nothing needs cleaning up; no install is needed because a
      # new workspace package's dependencies are already hoisted.
      - name: Generated service passes the bar
        run: |
          npx nx g @atlas/generators:service scaffold-ci --db --broker --description "CI proof."
          npx nx run-many -t lint typecheck test -p @atlas/scaffold-ci
          node --check apps/scaffold-ci/src/main.ts

  # Conventional commits (EP-01.6). Deliberately NOT in the required-checks list: a
  # non-conforming subject is a real problem but not a broken build, and blocking a merge on
  # it would mean rewriting history to fix a typo. Visible on the PR is the right weight.
  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check conventional-commit format
        run: |
          # `spike` is ours, not Conventional Commits': the delivery process treats a spike as a
          # first-class work type with its own artifact rule (20-delivery-process.md §5),
          # so filing one as `chore` would hide it in the history.
          pattern='^(feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert|spike)(\([a-zA-Z0-9._,/-]+\))?!?: .+'
          fail=0
          # --no-merges: a merge commit's subject is generated by GitHub, not by us.
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::not a conventional commit: $subject"
              fail=1
            else
              echo "ok: $subject"
            fi
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          if [ "$fail" -eq 1 ]; then
            echo "Expected: <type>(<scope>): <subject>   e.g. feat(EP-04.1): lift service-kit into libs/"
            exit 1
          fi

      # EP-02.6: a change to @atlas/contracts' surface — its exports or the schemas it loads —
      # names itself in libs/contracts/CHANGELOG.md, or the version that ships it cannot say what
      # it carries. Needs a base to diff against, so it lives with the other pull-request-only check.
      - name: Contract changes are in the changelog
        run: node scripts/check-changelog.mjs --base "origin/${{ github.base_ref }}"
