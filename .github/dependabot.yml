# Dependabot was running on GitHub's defaults, which is why it opened a PR for `reference/` — the
# FROZEN prototype that nothing installs — while the root workspace carried the same advisory
# unpatched (GHSA-7p8r-x3mc-p8w7, fast-uri). A default that watches the wrong tree is worse than
# none: it produces PRs that look like the vulnerability is being handled.

version: 2

updates:
  # The real product. npm workspaces means ONE lock file covers libs/, apps/ and spikes/, so this
  # single entry is the whole platform.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      # The commit-message CI job enforces Conventional Commits on every commit in a PR, and
      # Dependabot's default subject would fail it.
      prefix: chore
      include: scope
    groups:
      # One PR per ecosystem-ish cluster rather than per package. A dozen separate PRs against a
      # protected branch means a dozen CI runs and a dozen merges, and the security ones get lost
      # among the routine bumps.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      typescript-eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "@typescript-eslint/*"]
      types:
        patterns: ["@types/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Studio's toolchain is pinned as a set — Angular, its CLI and its TypeScript move together,
      # and a lone major from Dependabot cannot be merged without the rest. Majors are done
      # deliberately, as one change (see apps/studio/README.md).
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # `@types/node` tracks the RUNTIME, not `latest`. We run Node 24, so the types are pinned ^24;
      # a major bump would type APIs the runtime does not have. This was offered twice (#214, #220)
      # and refused twice — the rule is cheaper than rediscovering the reasoning each month. Move
      # it deliberately, when the runtime moves.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # `amqplib` exists only in spikes/broker, as the RabbitMQ side of the comparison that
      # ADR-0001 REJECTED. A spike is a record of an experiment: changing what it was measured
      # against makes the numbers in that ADR unreproducible, for a client nothing ships. Security
      # advisories still come through — only routine version bumps are ignored.
      - dependency-name: amqplib
      - dependency-name: "@types/amqplib"

  # `reference/` is the frozen prototype: not an npm workspace, never installed by the root, never
  # built, never shipped, never run by CI. It is registered here for ONE reason — so a security
  # advisory against it produces an automated fix PR.
  #
  # SECURITY ONLY: `open-pull-requests-limit: 0` disables version updates for these directories.
  # Dependabot *security* updates are a separate mechanism and are unaffected by the limit, so a
  # vulnerability still opens a PR while a routine minor bump does not.
  #
  # The reasoning is what this tree IS. Its value is being the validated record of a prototype being
  # lifted into libs/ package by package — so keeping its dependencies current is not modernisation,
  # it is quietly making the record no longer describe what was validated. Bumps were taken by hand
  # (#234, #235) and verified by running its tests; that is the right cadence for a frozen tree, not
  # a PR every month forever for code nothing installs.
  #
  # Note what this does NOT turn off: Dependabot ALERTS come from the dependency graph, which scans
  # every lock file in the repository regardless of this config. That is how the fast-uri advisory
  # (GHSA-7p8r-x3mc-p8w7) surfaced against reference/contracts and reference/bms-workflow while the
  # top-level tree reported itself clean. Visibility was never the gap; the automated fix was.
  #
  # `directories`, not `directory`, and that distinction is load-bearing: reference/ is NOT one
  # workspace. It carries FIVE independent lock files, and a single `/reference` entry watches
  # exactly one of them — which is how two subtrees sat on a high-severity advisory unnoticed.
  - package-ecosystem: npm
    directories:
      - /reference
      - /reference/bms-workflow
      - /reference/contracts
      - /reference/messaging
      - /reference/service-kit
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope

  # The pinned action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
