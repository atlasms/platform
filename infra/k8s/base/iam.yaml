apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: atlas
spec:
  # ONE replica, and that is a correctness constraint, not a capacity choice: IAM currently
  # generates its signing key ring per process, so a second replica would mint tokens the first
  # cannot verify. Scaling this requires loading the ring from a Secret (EP-10).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam
        app.kubernetes.io/part-of: atlas
    spec:
      # Kubernetes stops routing to a terminating pod and sends SIGTERM at the same moment, so a
      # request already in flight can still arrive. main.ts drains Fastify; this is the budget.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iam
          image: atlas/iam:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_ISSUER
              value: atlas-iam
            - name: ATLAS_AUDIENCE
              value: atlas
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # No CPU limit on purpose: CPU is compressible, and a limit throttles a service that
              # is merely busy. Memory IS limited — an unbounded leak takes the node with it.
              memory: 512Mi
          # Liveness asks "is this process wedged?" — restarting is the only cure, so it must not
          # depend on anything external, or a dependency outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness asks "should traffic come here?" — that DOES include dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Startup probe gives a slow boot room without loosening liveness afterwards.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    app.kubernetes.io/name: iam
  ports:
    - name: http
      port: 3000
      targetPort: http
