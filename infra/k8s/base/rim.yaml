# rim — generated by `nx g @atlas/generators:service`. The same shape as every other
# service in this directory; the reasons are in ../README.md ("Deliberate choices in base/").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rim
  labels:
    app.kubernetes.io/name: rim
    app.kubernetes.io/part-of: atlas
spec:
  # One replica until the service has a reason for more; raise it WITH a PodDisruptionBudget.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rim
        app.kubernetes.io/part-of: atlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes stops routing and sends SIGTERM at the same moment; main.ts drains within this.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rim
          image: atlas/rim:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_IAM_ORIGIN
              value: http://iam:3000
            - name: ATLAS_NATS_URL
              value: nats://nats:4222
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@postgres:5432/atlas
            # The staging area (EP-15.1): where uploaded parts land and a completed upload is
            # assembled. RIM's own landing zone on a volume of its own — NOT the platform's
            # storage, which only HSM writes (FR-HSM-5). The root filesystem is read-only, so the
            # volume is the one place this pod can write bytes.
            - name: ATLAS_RIM_STAGING_DIR
              value: /var/lib/atlas/rim/staging
            # Every part but the last is exactly this long; the gateway allows it on /api/v1/uploads.
            - name: ATLAS_UPLOAD_PART_BYTES
              value: "8388608"
            # Folder watchers (EP-15.2): each channel's watch folders live under <root>/<channelId>/.
            # A facility binds this claim to its drop share; RIM reads it and removes what it took.
            - name: ATLAS_RIM_WATCH_ROOT
              value: /var/lib/atlas/watch
          volumeMounts:
            - name: staging
              mountPath: /var/lib/atlas/rim
            - name: watch
              mountPath: /var/lib/atlas/watch
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No CPU limit: CPU is compressible and a limit only adds latency. Memory is not.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          # Liveness: is the process wedged — no dependencies, or an outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should traffic come here — this one asks the dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Generous: main.ts may wait up to 120 s for the database on a fresh install.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: rim-staging
        - name: watch
          persistentVolumeClaim:
            claimName: rim-watch
---
# Staging survives a pod restart — an upload half-received when the pod went away is resumed,
# not restarted — but it is not the asset store and needs no replication: what matters is
# handed to HSM, and an upload abandoned past its TTL is swept.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rim-staging
  labels:
    app.kubernetes.io/name: rim
    app.kubernetes.io/part-of: atlas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# The folder watchers' root (EP-15.2). In a facility this is the drop share — an NFS or SMB export
# the playout and editing machines write to, bound through a PersistentVolume or a StorageClass
# (the chart's `storageClass` and `storage.rimWatch`). A watcher scans by listing, not inotify,
# precisely so a network mount works. Laptop-sized here: files pass through, they do not stay.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rim-watch
  labels:
    app.kubernetes.io/name: rim
    app.kubernetes.io/part-of: atlas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rim
  labels:
    app.kubernetes.io/name: rim
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    app.kubernetes.io/name: rim
  ports:
    - name: http
      port: 3000
      targetPort: http
