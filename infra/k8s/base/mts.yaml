# mts — generated by `nx g @atlas/generators:service`. The same shape as every other
# service in this directory; the reasons are in ../README.md ("Deliberate choices in base/").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mts
  labels:
    app.kubernetes.io/name: mts
    app.kubernetes.io/part-of: atlas
spec:
  # A replica count, not a constraint (EP-16.6, #145). Every pod leases one job at a time from the
  # queue TABLE by compare-and-set, so N pods split the work without coordinating; and since HSM
  # (EP-14.7) holds every input and every rendition, the work area below is per-pod SCRATCH — an
  # `inputFile` fetched for one job, a rendition until it is pushed — not a volume pods must share.
  # One here (a laptop); the dev overlay runs two so smoke proves they share the queue, staging two
  # behind a PDB, and the Helm chart makes it `replicas.mts`. A rolling update is safe: a pod being
  # replaced drains, putting its running job back on the queue with its attempt returned.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mts
        app.kubernetes.io/part-of: atlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes stops routing and sends SIGTERM at the same moment; main.ts drains within this.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mts
          image: atlas/mts:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_IAM_ORIGIN
              value: http://iam:3000
            - name: ATLAS_NATS_URL
              value: nats://nats:4222
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@postgres:5432/atlas
            # Scratch, per pod (EP-14.7, EP-16.6): renditions are written here, pushed to HSM and
            # removed; an `inputFile` job's input is fetched here from HSM. A path input must be
            # inside it — the sample clip the dev overlay renders into EVERY pod's scratch.
            - name: ATLAS_MTS_WORK_DIR
              value: /var/lib/atlas/mts
            # HSM (ADR-0009): every rendition goes there, signed with HSM's internal key. Optional,
            # like every internal key — but without it renditions stay in the pod's SCRATCH and are
            # gone at its next restart (main.ts says so at startup), and `inputFile` jobs are refused.
            - name: ATLAS_HSM_ORIGIN
              value: http://hsm:3000
            - name: ATLAS_HSM_INTERNAL_KEYS
              valueFrom:
                secretKeyRef:
                  name: hsm-internal-keys
                  key: keys
                  optional: true
          volumeMounts:
            - name: work
              mountPath: /var/lib/atlas/mts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No CPU limit: CPU is compressible and a limit only adds latency. Memory is not.
          # FFmpeg is the load, not Node. No CPU limit: a throttled encoder is only a slower one,
          # and the request is what the scheduler places the pod by. Memory is bounded because an
          # H.264 encode of a broadcast master is the one thing in this platform that can use gigabytes.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
          # Liveness: is the process wedged — no dependencies, or an outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should traffic come here — this one asks the dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Generous: main.ts may wait up to 120 s for the database on a fresh install.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
      volumes:
        # Scratch, per pod (see `replicas` above). Bounded: a pod whose transcodes outgrow it is
        # evicted rather than filling the node — size it for the largest master × concurrent jobs
        # (one per pod today). Staging sets a facility's size.
        - name: work
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mts
  labels:
    app.kubernetes.io/name: mts
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    app.kubernetes.io/name: mts
  ports:
    - name: http
      port: 3000
      targetPort: http
