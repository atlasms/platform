# scheduling — generated by `nx g @atlas/generators:service`. The same shape as every other
# service in this directory; the reasons are in ../README.md ("Deliberate choices in base/").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling
  labels:
    app.kubernetes.io/name: scheduling
    app.kubernetes.io/part-of: atlas
spec:
  # One replica until the service has a reason for more; raise it WITH a PodDisruptionBudget.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduling
        app.kubernetes.io/part-of: atlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes stops routing and sends SIGTERM at the same moment; main.ts drains within this.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduling
          image: atlas/scheduling:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_IAM_ORIGIN
              value: http://iam:3000
            - name: ATLAS_NATS_URL
              value: nats://nats:4222
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@postgres:5432/atlas
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No CPU limit: CPU is compressible and a limit only adds latency. Memory is not.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          # Liveness: is the process wedged — no dependencies, or an outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should traffic come here — this one asks the dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Generous: main.ts may wait up to 120 s for the database on a fresh install.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
---
apiVersion: v1
kind: Service
metadata:
  name: scheduling
  labels:
    app.kubernetes.io/name: scheduling
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    app.kubernetes.io/name: scheduling
  ports:
    - name: http
      port: 3000
      targetPort: http
