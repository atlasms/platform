# hsm — generated by `nx g @atlas/generators:service`. The same shape as every other
# service in this directory; the reasons are in ../README.md ("Deliberate choices in base/").
#
# THE ONLY WORKLOAD THAT MOUNTS STORAGE (ADR-0009, EP-14.7): the `hsm-storage` volume and the
# `hsm-storage-credentials` Secret appear in this file and nowhere else — `npm run k8s:check`
# fails the build if another workload mounts either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsm
  labels:
    app.kubernetes.io/name: hsm
    app.kubernetes.io/part-of: atlas
spec:
  # One replica while the storage volume is ReadWriteOnce (a kind laptop's only kind). The code
  # already scales — placements and operation leases are compare-and-sets — so a facility on a
  # ReadWriteMany volume (or S3 targets) raises this WITH a PodDisruptionBudget.
  replicas: 1
  # Recreate: the new pod cannot mount the RWO volume until the old one lets go. The old pod's
  # drain lets its operation lease lapse; the next worker takes it back, idempotently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hsm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hsm
        app.kubernetes.io/part-of: atlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes stops routing and sends SIGTERM at the same moment; main.ts drains within this.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hsm
          image: atlas/hsm:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_IAM_ORIGIN
              value: http://iam:3000
            - name: ATLAS_NATS_URL
              value: nats://nats:4222
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@postgres:5432/atlas
            # ADR-0009. The storage mounted into THIS pod; an fs target's root must lie under it.
            - name: ATLAS_HSM_FS_BASE
              value: /storage
            # The platform's first online target, made once from this when there is none.
            - name: ATLAS_HSM_BOOTSTRAP_ROOT
              value: /storage/online
            - name: ATLAS_HSM_CREDENTIALS_DIR
              value: /var/run/atlas/hsm-credentials
            # Producers sign placements with these (hsm-internal-keys; ADR-0008/0009). Optional:
            # without it HSM refuses every placement — nothing reaches storage, nothing else breaks.
            - name: ATLAS_HSM_INTERNAL_KEYS
              valueFrom:
                secretKeyRef:
                  name: hsm-internal-keys
                  key: keys
                  optional: true
            # Readers sign with these (hsm-read-keys; EP-31: Scheduling's availability check).
            # Accepted on the read-only availability route ONLY. Optional.
            - name: ATLAS_HSM_READ_KEYS
              valueFrom:
                secretKeyRef:
                  name: hsm-read-keys
                  key: keys
                  optional: true
          volumeMounts:
            - name: storage
              mountPath: /storage
            # An S3 target's credentials: `<credentialRef>/accessKeyId|secretAccessKey`. Mounted
            # here only; never in the database, an API response or a log.
            - name: storage-credentials
              mountPath: /var/run/atlas/hsm-credentials
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No CPU limit: CPU is compressible and a limit only adds latency. Memory is not.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          # Liveness: is the process wedged — no dependencies, or an outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should traffic come here — this one asks the dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Generous: main.ts may wait up to 120 s for the database on a fresh install.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: hsm-storage
        - name: storage-credentials
          secret:
            secretName: hsm-storage-credentials
            # Optional: a platform with only filesystem targets has no S3 credentials to hold.
            optional: true
---
# The online tier's filesystem (ADR-0009). A laptop's size and access mode here; a facility binds it
# to its SAN/NAS (ReadWriteMany) and sizes it — or adds S3 targets and keeps this small.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hsm-storage
  labels:
    app.kubernetes.io/name: hsm
    app.kubernetes.io/part-of: atlas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hsm
  labels:
    app.kubernetes.io/name: hsm
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    app.kubernetes.io/name: hsm
  ports:
    - name: http
      port: 3000
      targetPort: http
