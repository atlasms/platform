# A sample input for MTS, rendered into its scratch on start — DEV ONLY, like the seed user.
#
# The smoke suite's transcodes that take a PATH input read this clip; everything else reads its
# input from HSM. The work area is per-pod scratch (EP-16.6), so this init container renders the
# clip into EVERY pod's scratch, and a job leased by either worker finds it.
#
# `-n` and the existence test make it idempotent within a pod's life.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mts
spec:
  template:
    spec:
      initContainers:
        - name: sample
          image: atlas/mts:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/atlas/mts/samples &&
              [ -s /var/lib/atlas/mts/samples/smoke.mp4 ] ||
              ffmpeg -nostdin -loglevel error -n
              -f lavfi -i testsrc=size=320x240:rate=25:duration=3
              -f lavfi -i sine=frequency=440:duration=3
              -c:v libx264 -preset ultrafast -c:a aac -shortest
              /var/lib/atlas/mts/samples/smoke.mp4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: work
              mountPath: /var/lib/atlas/mts
