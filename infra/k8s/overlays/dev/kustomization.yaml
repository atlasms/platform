# Local development on kind.
#
#   kind create cluster --config infra/k8s/kind-cluster.yaml
#   npm run k8s:up
#   npm run smoke
#
# Everything here exists because it is WRONG for production: a NodePort instead of an ingress, one
# gateway replica instead of two, images that must already be on the node, and a seeded account
# whose password is committed to the repository.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: atlas

resources:
  - ../../base
  - nodeport.yaml
  - ws-nodeport.yaml

# kind has no registry. `kind load docker-image` puts the image on the node directly, and
# IfNotPresent stops the kubelet trying to pull a tag that exists nowhere. In every real
# environment this is a digest from a registry.
images:
  - name: atlas/iam
    newTag: dev
  - name: atlas/mam
    newTag: dev
  - name: atlas/websocket
    newTag: dev
  - name: atlas/api-gateway
    newTag: dev
  - name: atlas/logging
    newTag: dev
  - name: atlas/scheduling
    newTag: dev
  - name: atlas/rim
    newTag: dev
  - name: atlas/mts
    newTag: dev
  - name: atlas/hsm
    newTag: dev

# The base declares no credentials at all — it names a Secret and stops there, so nothing in the
# environment-independent layer can leak one. This generator is the dev value, and it is committed
# BECAUSE it is worthless: a real install supplies its own Secret and deletes this block.
secretGenerator:
  - name: postgres-credentials
    literals:
      - username=atlas
      - password=atlas
    options:
      # Without this the Secret gets a content hash suffix and every consumer's reference has to be
      # rewritten by kustomize — which works, but makes `kubectl get secret` output confusing for
      # no benefit at a password that never rotates.
      disableNameSuffixHash: true
  # RIM's internal signing key (ADR-0008) — worthless for the same reason: dev only, committed.
  - name: rim-internal-keys
    literals:
      - keys=dev-only-rim-internal-signing-key-0000000000
    options:
      disableNameSuffixHash: true
  # HSM's internal signing key (ADR-0009): what MTS signs its renditions with. Dev only, committed.
  - name: hsm-internal-keys
    literals:
      - keys=dev-only-hsm-internal-signing-key-0000000000
    options:
      disableNameSuffixHash: true
  # HSM's READ key (EP-31): what Scheduling signs its availability question with. Dev only.
  - name: hsm-read-keys
    literals:
      - keys=dev-only-hsm-read-signing-key-000000000000000
    options:
      disableNameSuffixHash: true

# ONE `patches:` key. Two would not be a merge — YAML duplicate keys silently override, so the
# second list wins and the first is dropped without a warning from kustomize or kubectl.
patches:
  # A bootstrap account, so a fresh cluster is usable and the smoke suite can prove the whole
  # token path rather than only that a wrong password is refused. Dev only — see the file.
  - path: seed-user.yaml
  # A sample clip in MTS's work area, so smoke can run a real transcode (see the file).
  - path: mts-sample.yaml
  # A sample file in RIM's watch folder, so smoke can run a folder watcher (EP-15.2, see the file).
  - path: rim-watch-sample.yaml
  # A live test feed beside each recorder worker, so smoke can record (EP-39, see the file).
  - path: rim-recorder-feed.yaml

  # TWO MTS workers (EP-16.6): the one service whose replica count the smoke suite should exercise —
  # both lease from the queue table, each with its own scratch and its own sample clip, and smoke's
  # transcodes land on whichever leases them.
  - target:
      kind: Deployment
      name: mts
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # One replica: a laptop does not need two, and a single pod makes `kubectl logs` legible.
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: mam
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
