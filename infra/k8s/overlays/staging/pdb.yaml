# The two-replica deployments stay reachable through a node drain or a rollout: one pod of each
# is always available. A PDB for a single-replica deployment would BLOCK drains, so IAM (one
# replica by a correctness constraint — its signing key ring is per process) has none.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mam
  labels:
    app.kubernetes.io/name: mam
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mam
---
# The recorder workers (EP-39; ADR-0007): the two workers taking turns at every cut. A drain may
# take ONE — the other records on, and takes the drained one's captures over as continuations.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rim-recorder
  labels:
    app.kubernetes.io/name: rim-recorder
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rim-recorder
---
# MTS (EP-16.6): workers leasing from one queue table. A drain may take one; its running job goes
# back on the queue with its attempt returned, and the other takes it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mts
  labels:
    app.kubernetes.io/name: mts
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mts
