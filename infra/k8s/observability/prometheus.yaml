# Prometheus — the metrics store (EP-12.2).
#
# Chosen without a contest: `@atlas/service-kit` already emits Prometheus exposition format by hand,
# so anything that scrapes it works and switching would mean rewriting instrumentation for no gain.
# ADR-0003 measured its COST rather than its suitability.
#
# Promoted from spikes/observability/k8s with the spike-only compromises fixed — see the storage and
# retention notes below, which the spike deliberately left as emptyDir.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Pod discovery needs read access to the API. Deliberately read-only and limited to the resource
# kinds it actually uses — a scraper that can write is a scraper that can be turned into a foothold.
#
# Cluster-scoped because discovery must see the `atlas` namespace from `atlas-observability`. That
# is the one privilege this stack takes outside its own namespace, and it is worth stating plainly:
# an operator evaluating whether to install the overlay is entitled to know it reads pod metadata
# cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: atlas-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ANNOTATION-DRIVEN discovery, not a static target list. A static list is a second place to
      # remember every service, and the one that gets forgotten when a service ships — the pod
      # would simply stop being monitored, silently and without an error anywhere.
      #
      # It is also how the IAM gap was found: the pod announced a scrape target and answered
      # nothing, so Prometheus reported it DOWN (#205). A static list would have been edited to
      # match reality and the gap would have closed itself, invisibly.
      - job_name: atlas-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Rewrite the target's port to the annotated one. Two source labels joined by the
          # default `;` separator, so the regex takes the host from __address__ and the port from
          # the annotation — one relabel rule, not two keys in one (which YAML would silently
          # collapse, dropping the first).
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          # Keep the SERVICE name as a label, not the pod name: a pod name contains a replicaset
          # hash that changes on every rollout, which would mint a new time series per deploy.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
---
# 7 days of metrics must survive a restart, so this is a PVC rather than the spike's emptyDir.
#
# Sized for the retention window, not for growth: at the cardinality this platform emits — closed
# label sets, route templates, a cardinality cap in service-kit — 7 days is comfortably under 2 GiB.
# An install that raises retention must raise this with it; Prometheus does not shrink to fit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  # A PVC is ReadWriteOnce, so a rolling update would deadlock: the new pod cannot attach the
  # volume until the old one releases it, and the old one is not terminated until the new one is
  # ready. Recreate accepts a few seconds of blindness instead of a stuck rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # 7 days. This is an OPERATOR's debugging window, not the audit trail — long-term
            # retention is the Logging & Analytics service's job, with different guarantees.
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # No CPU limit: CPU is compressible and throttling a scraper makes it miss samples,
              # which looks exactly like the service being scraped going down.
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
