# Grafana Alloy — the collector (EP-12.1).
#
# The pick that earns its place twice: it ships logs AND receives OTLP, so tracing (EP-12.3) is
# configuration here rather than a separate collector in the bundle. Both halves are wired now that
# EP-04.7 emits spans.
#
# Services send to Alloy rather than straight to Tempo, so there is ONE place to add sampling,
# redaction or a second destination later. It also means a service needs to know exactly one
# telemetry address.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-alloy
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  # Reading logs through the API is what lets this run WITHOUT mounting the host filesystem.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: atlas-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "atlas" {
      targets = discovery.kubernetes.pods.targets

      // Only Atlas' own namespaces. Collecting kube-system as well would multiply the log volume
      // for output an Atlas operator cannot act on anyway.
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "atlas|atlas-observability"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    // Reads container stdout through the Kubernetes API rather than /var/log/pods on the host.
    // No hostPath mount, no privileged container — a log shipper with the host filesystem mounted
    // is a large amount of trust to grant something whose job is to read text.
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.atlas.output
      forward_to = [loki.process.atlas.receiver]
    }

    loki.process "atlas" {
      forward_to = [loki.write.default.receiver]

      // Every Atlas service logs structured JSON to stdout, so `level` is a real field rather than
      // something to regex out of a message. That is the whole reason `createLogger` exists.
      stage.json {
        expressions = { level = "level", correlationId = "correlationId" }
      }
      stage.labels {
        values = { level = "level" }
      }
      // correlationId is deliberately NOT a label. It is unbounded — one value per request — and a
      // Loki label set is a stream: promoting it would mint a stream per request and shred the
      // index, which is the exact same cardinality trap as putting a user id in a metric label.
      // It stays in the line, where `|= "01K..."` finds it across every service in one query.
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

    // --- traces (EP-12.3) ----------------------------------------------------------------------
    //
    // HTTP only. service-kit's exporter is OTLP/HTTP JSON (ADR-0004), and opening a gRPC port that
    // nothing in the platform speaks would be one more reachable surface for no benefit.
    otelcol.receiver.otlp "default" {
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces = [otelcol.processor.batch.default.input]
      }
    }

    // Batching here as well as in the exporter, because they solve different problems: service-kit
    // batches to avoid a request per span, this one batches ACROSS services so Tempo sees a steady
    // trickle rather than a burst every time a pod's flush timer fires.
    otelcol.processor.batch "default" {
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo:4317"
        // Plaintext inside the cluster. NOT a shortcut being papered over: NFR-SEC-1 puts internal
        // transport encryption at the MESH (mTLS), not in each application, so terminating TLS here
        // would duplicate it and give two places to get certificates wrong.
        tls {
          insecure = true
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
      # Scraped, because the collector is the component whose failure is hardest to notice: when a
      # log shipper stops, the symptom is SILENCE, which looks exactly like a quiet platform. Its
      # own metrics (dropped entries, send failures, queue depth) are the only way to tell.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - name: http
              containerPort: 12345
            - name: otlp-http
              containerPort: 4318
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: tmp
              mountPath: /tmp/alloy
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: alloy-config
        # Alloy's write-ahead buffer. emptyDir rather than a PVC on purpose: a DaemonSet gets one
        # pod per node, and a ReadWriteOnce volume cannot follow that. What is lost on a restart is
        # at most the few seconds in flight — the source of truth is the container's stdout, which
        # the kubelet still holds.
        - name: tmp
          emptyDir: {}
---
# A DaemonSet has no address to send to, so the OTLP receiver needs a Service. Traffic lands on
# whichever Alloy pod the Service picks, which is fine — a span carries its own trace id, so it does
# not matter which collector instance forwards it.
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
