# GENERATED from infra/k8s/base/logging.yaml by scripts/build-helm-chart.mjs — do not edit.
# Change the manifest and run `npm run helm:build`; `npm run k8s:check` fails if you do not.
# logging — generated by `nx g @atlas/generators:service`. The same shape as every other
# service in this directory; the reasons are in ../README.md ("Deliberate choices in base/").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging
  labels:
    app.kubernetes.io/name: logging
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  # One replica until the service has a reason for more; raise it WITH a PodDisruptionBudget.
  replicas: {{ .Values.replicas.logging }}
  selector:
    matchLabels:
      app.kubernetes.io/name: logging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logging
        app.kubernetes.io/part-of: atlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes stops routing and sends SIGTERM at the same moment; main.ts drains within this.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logging
          image: {{ include "atlas.image" (dict "ctx" . "name" "logging") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_IAM_ORIGIN
              value: http://iam:3000
            - name: ATLAS_NATS_URL
              value: nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}
            # The hot index (EP-07.4). Unset it and the browse is answered by Postgres instead —
            # correct, and slower as the log grows. Nothing else changes.
            - name: ATLAS_OPENSEARCH_URL
              value: http://{{ .Values.opensearch.host }}:{{ .Values.opensearch.port }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.userKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No CPU limit: CPU is compressible and a limit only adds latency. Memory is not.
          resources:
            {{- toYaml .Values.resources.logging | nindent 12 }}
          # Liveness: is the process wedged — no dependencies, or an outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should traffic come here — this one asks the dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Generous: main.ts may wait up to 120 s for the database on a fresh install.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: logging
  labels:
    app.kubernetes.io/name: logging
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: logging
  ports:
    - name: http
      port: 3000
      targetPort: http
