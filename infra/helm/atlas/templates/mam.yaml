# GENERATED from infra/k8s/base/mam.yaml by scripts/build-helm-chart.mjs — do not edit.
# Change the manifest and run `npm run helm:build`; `npm run k8s:check` fails if you do not.
# MAM — the media asset catalogue ([mam.md](../../../docs/architecture/services/mam.md)).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mam
  labels:
    app.kubernetes.io/name: mam
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  # Two is safe here, unlike IAM: MAM holds no per-process state. Migrations take a Postgres
  # advisory lock, so replicas starting together do not race to apply them, and the outbox relay
  # marks a row sent in the same statement it claims it.
  replicas: {{ .Values.replicas.mam }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mam
        app.kubernetes.io/part-of: atlas
      # The scrape contract, and it is deliberately on the POD rather than in a scraper's config.
      # A service that ships announces itself; a central target list is a second place to remember
      # it, and the one that gets forgotten — leaving the pod silently unmonitored. Any
      # Prometheus-compatible scraper honours these, including a customer's own.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mam
          image: {{ include "atlas.image" (dict "ctx" . "name" "mam") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_IAM_ORIGIN
              value: http://iam:3000
            - name: ATLAS_NATS_URL
              value: nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}
            # Assembled from the secret rather than stored as a URL, so the password exists in
            # exactly one place and rotating it does not mean rewriting a connection string.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.userKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources.mam | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness covers Postgres and IAM — without either, every request fails — but NOT the
          # broker. With NATS down, writes still commit and their events queue in the outbox until
          # it returns; that is what the outbox is for. Failing readiness there would take the
          # catalogue out of service to protect an announcement about it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mam
  labels:
    app.kubernetes.io/name: mam
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mam
  ports:
    - name: http
      port: 3000
      targetPort: http
