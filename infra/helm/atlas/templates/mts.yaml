# GENERATED from infra/k8s/base/mts.yaml by scripts/build-helm-chart.mjs — do not edit.
# Change the manifest and run `npm run helm:build`; `npm run k8s:check` fails if you do not.
# mts — generated by `nx g @atlas/generators:service`. The same shape as every other
# service in this directory; the reasons are in ../README.md ("Deliberate choices in base/").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mts
  labels:
    app.kubernetes.io/name: mts
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  # ONE replica, and today that is a constraint rather than a design: the work area is a
  # ReadWriteOnce volume, so a second pod could not mount it on another node. MTS is meant to be
  # the platform's scale-to-many service (mts.md §8) — each pod leases one job at a time from the
  # table, so the code already scales — and that becomes a replica count the day HSM (EP-14)
  # provides the shared storage inputs and renditions live on.
  replicas: 1
  # Recreate, not RollingUpdate: the new pod cannot mount the RWO volume until the old one lets
  # go, and a rolling update would sit at "0 of 1 ready" until it timed out. The old pod's drain
  # puts its running job back on the queue with its attempt returned (service.ts), so nothing is
  # lost in the gap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mts
        app.kubernetes.io/part-of: atlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes stops routing and sends SIGTERM at the same moment; main.ts drains within this.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mts
          image: {{ include "atlas.image" (dict "ctx" . "name" "mts") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_IAM_ORIGIN
              value: http://iam:3000
            - name: ATLAS_NATS_URL
              value: nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.userKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
            # EP-16.2. Inputs are read from here and renditions written under `renditions/<job>/`.
            # Until HSM resolves paths, a job's input must be inside it (service.ts refuses one
            # that is not).
            - name: ATLAS_MTS_WORK_DIR
              value: /var/lib/atlas/mts
          volumeMounts:
            - name: work
              mountPath: /var/lib/atlas/mts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No CPU limit: CPU is compressible and a limit only adds latency. Memory is not.
          # FFmpeg is the load, not Node. No CPU limit: a throttled encoder is only a slower one,
          # and the request is what the scheduler places the pod by. Memory is bounded because an
          # H.264 encode of a broadcast master is the one thing in this platform that can use gigabytes.
          resources:
            {{- toYaml .Values.resources.mts | nindent 12 }}
          # Liveness: is the process wedged — no dependencies, or an outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should traffic come here — this one asks the dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Generous: main.ts may wait up to 120 s for the database on a fresh install.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: mts-work
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The work area: inputs until HSM provides them, and every rendition MTS writes. A laptop's size
# here; the staging overlay sizes it for a facility.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mts-work
  labels:
    app.kubernetes.io/name: mts
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.mtsWork }}
  {{- with .Values.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mts
  labels:
    app.kubernetes.io/name: mts
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mts
  ports:
    - name: http
      port: 3000
      targetPort: http
