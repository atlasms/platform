# GENERATED from infra/k8s/base/iam.yaml by scripts/build-helm-chart.mjs — do not edit.
# Change the manifest and run `npm run helm:build`; `npm run k8s:check` fails if you do not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  # ONE replica, and that is a correctness constraint, not a capacity choice: IAM currently
  # generates its signing key ring per process, so a second replica would mint tokens the first
  # cannot verify. Scaling this requires loading the ring from a Secret (EP-10).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam
        app.kubernetes.io/part-of: atlas
      # See mam.yaml: the pod announces its own scrape target, so a service cannot ship and be
      # silently unmonitored. Honoured by any Prometheus-compatible scraper, ours or a customer's.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes stops routing to a terminating pod and sends SIGTERM at the same moment, so a
      # request already in flight can still arrive. main.ts drains Fastify; this is the budget.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iam
          image: {{ include "atlas.image" (dict "ctx" . "name" "iam") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ATLAS_ISSUER
              value: atlas-iam
            - name: ATLAS_AUDIENCE
              value: atlas
            # EP-10.4: identity persists in Postgres — users, credentials, sessions, grants —
            # wired the way every other service's store is.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.userKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlas.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: ATLAS_PG_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}
            # EP-10.6: the outbox relay publishes permissions.changed and the rest.
            - name: ATLAS_NATS_URL
              value: nats://{{ .Values.nats.host }}:{{ .Values.nats.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources.iam | nindent 12 }}
          # Liveness asks "is this process wedged?" — restarting is the only cure, so it must not
          # depend on anything external, or a dependency outage becomes a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness asks "should traffic come here?" — that DOES include dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Startup probe gives a slow boot room without loosening liveness afterwards.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: iam
  ports:
    - name: http
      port: 3000
      targetPort: http
