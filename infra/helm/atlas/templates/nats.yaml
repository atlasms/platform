{{- if .Values.nats.enabled }}
# GENERATED from infra/k8s/base/nats.yaml by scripts/build-helm-chart.mjs — do not edit.
# Change the manifest and run `npm run helm:build`; `npm run k8s:check` fails if you do not.
# NATS with JetStream — the message broker ([ADR-0001](../../../docs/adr/0001-message-broker.md)).
#
# JetStream is FILE-backed here, not memory-backed. A memory store loses every unacknowledged
# message on restart, which would quietly turn at-least-once delivery into at-most-once and defeat
# the outbox on the consumer side of the hop.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
data:
  nats.conf: |
    port: 4222
    http: 8222

    jetstream {
      store_dir: "/data"
      max_memory_store: 256MB
      max_file_store: 4GB
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  serviceName: nats
  # One node. A JetStream cluster needs an odd quorum (3+) and per-stream replica settings; that is
  # a production topology decision, not something to half-configure here.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: atlas
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: {{ include "atlas.image" (dict "ctx" . "name" "nats") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/nats/nats.conf"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources.nats | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
          # /healthz on the monitoring port. `js-enabled-only` is the point of the readiness check:
          # the server accepts connections before JetStream has finished recovering its streams, and
          # a client that connects in that window fails to publish.
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: nats-config
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.nats }}
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: atlas
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
{{- end }}
